# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: overture.maps.release
name: Overture Maps source family
status: candidate
source_type: overture
authority: Overture Maps Foundation
license_url: https://docs.overturemaps.org/attribution/
attribution: Overture Maps Foundation and contributing data providers.
requirements:
  duckdb_extensions:
  - httpfs
tables:
- id: place
  ref: odd.overturemaps.latest.place
  description: Places and points of interest. One row per Overture place feature.
  columns_hint:
    id: Stable Overture feature id.
    names: Nested names object; primary/common/local names are not plain text columns.
    bbox: Bounding box for fast spatial prefilters.
    geometry: Place geometry.
  ask_for:
  - bbox or area
  - release or latest
  - limit
  warnings:
  - Large global table; always use tight bbox filters.
  validations:
  - id: odd.overturemaps.latest.place
    description: Compare the latest Overture places facade with the direct public
      S3 parquet recipe over a sampled tiny bbox.
    release: latest
    compare: exact
    order_by:
    - id
    limit: 10
    direct_sql: "LOAD httpfs;\nSET s3_region='us-west-2';\nSET VARIABLE overture_latest_release_url\
      \ = (\n  SELECT l.href\n  FROM (SELECT unnest(links) AS l FROM read_json('https://stac.overturemaps.org/catalog.json'))\n\
      \  WHERE l.rel = 'child' AND l.latest\n);\nSET VARIABLE s3_uri = (\n  SELECT\
      \ regexp_replace(\n           regexp_replace(min(assets.aws.href), '^https://([^.]+)\\\
      \\.s3\\\\.[^/]+/', 's3://\\\\1/'),\n           '/part-[^/]+$',\n           '/*'\n\
      \         )\n  FROM read_parquet(replace(getvariable('overture_latest_release_url'),\
      \ '/catalog.json', '/collections.parquet'))\n  WHERE collection = 'place'\n\
      );\n\nSELECT id, names, bbox\nFROM read_parquet(getvariable('s3_uri'))\nWHERE\
      \ bbox.xmin <= 66.981\n  AND bbox.xmax >= 66.976\n  AND bbox.ymin <= 39.657\n\
      \  AND bbox.ymax >= 39.652\nORDER BY id\nLIMIT 10;\n"
    odd_sql: "LOAD open_data_duck;\nATTACH ':memory:' AS odd (TYPE open_data_duck);\n\
      SELECT id, names, bbox\nFROM odd.overturemaps.latest.place\nWHERE bbox.xmin\
      \ <= 66.981\n  AND bbox.xmax >= 66.976\n  AND bbox.ymin <= 39.657\n  AND bbox.ymax\
      \ >= 39.652\nORDER BY id\nLIMIT 10;\n"
  - id: odd.overturemaps.x2026x10x21.place
    description: Compare a pinned, SQL-safe Overture release facade with the same
      direct release path over a sampled tiny bbox.
    release: x2026x10x21
    source_release: 2026-10-21.0
    compare: exact
    order_by:
    - id
    limit: 10
    direct_sql: "LOAD httpfs;\nSET s3_region='us-west-2';\nSET VARIABLE overture_s3_base\
      \ = 's3://overturemaps-us-west-2';\n\nSELECT id, names, bbox\nFROM read_parquet(\n\
      \  getvariable('overture_s3_base') || '/release/2026-10-21.0/theme=places/type=place/*'\n\
      )\nWHERE bbox.xmin <= 66.981\n  AND bbox.xmax >= 66.976\n  AND bbox.ymin <=\
      \ 39.657\n  AND bbox.ymax >= 39.652\nORDER BY id\nLIMIT 10;\n"
    odd_sql: "LOAD open_data_duck;\nATTACH ':memory:' AS odd (TYPE open_data_duck);\n\
      SELECT id, names, bbox\nFROM odd.overturemaps.x2026x10x21.place\nWHERE bbox.xmin\
      \ <= 66.981\n  AND bbox.xmax >= 66.976\n  AND bbox.ymin <= 39.657\n  AND bbox.ymax\
      \ >= 39.652\nORDER BY id\nLIMIT 10;\n"
