release:
  latest:
    method: stac-catalog
    url: https://stac.overturemaps.org/catalog.json
    resolve_sql: 'SELECT regexp_extract(l.href, ''/([0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+)/catalog\.json$'',
      1) AS release

      FROM (SELECT unnest(links) AS l FROM read_json(''https://stac.overturemaps.org/catalog.json''))

      WHERE l.rel = ''child'' AND l.latest;

      '
  pinned:
    duckdb_setting: overture_release
    s3_base_setting: overture_s3_base
    example: 2026-10-21.0
discovery:
  namespace: odd.overturemaps.latest
  discover_sql: "SELECT collection AS name,\n       'read_parquet' AS reader,\n  \
    \     regexp_replace(regexp_replace(min(assets.aws.href), '^https://([^.]+)\\\
    .s3\\.[^/]+/', 's3://\\1/'), '/part-[^/]+$', '/*') AS path\nFROM read_parquet('https://stac.overturemaps.org/{release}/collections.parquet')\n\
    GROUP BY collection;\n"
