- id: water
  ref: odd.overturemaps.latest.water
  description: Surface-water polygon and line features. One row per Overture water feature.
  ask_for:
  - bbox or area
  - release or latest
  - limit
  warnings:
  - Large global table; always use tight bbox filters.
  validations:
  - id: odd.overturemaps.latest.water
    description: Compare the latest Overture water facade with the direct public S3 parquet recipe over a sampled bbox.
    release: latest
    compare: exact
    order_by:
    - id
    limit: 10
    direct_sql: |
      LOAD httpfs;
      SET s3_region='us-west-2';
      SET VARIABLE overture_release = '2026-10-21.0';
      SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';
      SELECT id, bbox
      FROM read_parquet(getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=base/type=water/*')
      WHERE bbox.xmin <= 67.2
        AND bbox.xmax >= 66.8
        AND bbox.ymin <= 39.8
        AND bbox.ymax >= 39.5
      ORDER BY id
      LIMIT 10;
    odd_sql: |
      LOAD open_data_duck;
      ATTACH ':memory:' AS odd (TYPE open_data_duck);
      SET VARIABLE overture_release = '2026-10-21.0';
      SELECT id, bbox
      FROM odd.overturemaps.latest.water
      WHERE bbox.xmin <= 67.2
        AND bbox.xmax >= 66.8
        AND bbox.ymin <= 39.8
        AND bbox.ymax >= 39.5
      ORDER BY id
      LIMIT 10;
