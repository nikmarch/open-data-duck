# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: fred.series-observations
name: Federal Reserve FRED series observations API
status: candidate
source_type: other
authority: Federal Reserve Bank of St. Louis / FRED
license_url: https://fred.stlouisfed.org/legal/
attribution: Cite FRED, Federal Reserve Bank of St. Louis, the original source for each series, and the access date.
requirements:
  duckdb_extensions:
  - httpfs
auth:
  type: api_key
  required: true
  duckdb_setting: odd_fred_api_key
  env_var: FRED_API_KEY
  placeholder: "{api_key}"
  query_parameter: api_key
  custom_user_agent: open-data-duck/dev
release:
  latest:
    url: https://api.stlouisfed.org/fred/series/observations
    method: static-gdp-api-sample
discovery:
  namespace: odd.fred.latest
  discover_sql: |
    SELECT 'series_observations' AS name,
           'read_json' AS reader,
           'https://api.stlouisfed.org/fred/series/observations?series_id=GDP&file_type=json&api_key={api_key}' AS path;
tables:
- id: series_observations
  ref: odd.fred.latest.series_observations
  description: FRED API response for a fixed GDP observations smoke sample; unnest the observations array for one row per observation.
  columns_hint:
    observations: Array of FRED observation objects with realtime_start, realtime_end, date, and value fields.
  ask_for:
  - FRED series id
  - observation start/end dates
  - realtime vintage dates if revision history matters
  warnings:
  - Requires a user FRED API key via SET odd_fred_api_key or FRED_API_KEY.
  - The current facade is a GDP smoke sample until ODD supports parameterized table arguments.
  - FRED aggregates many original sources; preserve series-level source attribution in downstream use.
  validations:
  - id: odd.fred.latest.series_observations
    description: Compare FRED GDP observations through the direct API JSON reader and the ODD facade.
    release: latest
    direct_sql: |
      LOAD httpfs;
      SET odd_fred_api_key = '<your FRED API key>';
      SELECT realtime_start, realtime_end, date, value
      FROM (
        SELECT unnest(observations, recursive := true)
        FROM read_json('https://api.stlouisfed.org/fred/series/observations?series_id=GDP&file_type=json&api_key=' || current_setting('odd_fred_api_key'))
      )
      WHERE value <> '.'
      ORDER BY date
      LIMIT 5;
    odd_sql: |
      SET odd_fred_api_key = '<your FRED API key>';
      SELECT realtime_start, realtime_end, date, value
      FROM (
        SELECT unnest(observations, recursive := true)
        FROM odd.fred.latest.series_observations
      )
      WHERE value <> '.'
      ORDER BY date
      LIMIT 5;
    compare: exact
    order_by:
    - date
    limit: 5
