# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: geonames.daily-dumps
name: GeoNames daily geographic names dumps
status: connector-blocked
source_type: other
authority: GeoNames
license_url: https://creativecommons.org/licenses/by/4.0/
attribution: Attribute GeoNames and cite the selected dump file and download date.
tables:
- id: cities500
  description: GeoNames populated-place records with at least 500 inhabitants from the cities500 dump. One row per named place with coordinates, feature metadata, population, timezone, and modification date.
  columns_hint:
    geonameid: Stable GeoNames integer identifier for the place.
    name: UTF-8 place name as published by GeoNames.
    asciiname: ASCII-normalized place name.
    alternatenames: Comma-separated alternate names; can be very large for some rows.
    latitude: Place latitude in decimal degrees.
    longitude: Place longitude in decimal degrees.
    feature_class: GeoNames feature class code such as P for populated place.
    feature_code: GeoNames feature code such as PPL, PPLA, or PPLC.
    country_code: ISO 3166-1 alpha-2 country code.
    admin1_code: First-level administrative subdivision code.
    admin2_code: Second-level administrative subdivision code where present.
    population: Population value published in the dump.
    timezone: IANA timezone name.
    modification_date: Last modification date in the dump row.
  ask_for:
  - dump name such as cities500, cities1000, cities15000, allCountries, admin1CodesASCII, or alternateNames
  - country code or bounding box
  - feature class or feature code filters
  - whether alternate names are needed
  - limit
  warnings:
  - GeoNames daily dumps are ZIP archives containing tab-delimited text; DuckDB httpfs/read_csv cannot read the remote ZIP directly today.
  - Do not expose a queryable ODD facade until ODD has a safe ZIP-over-HTTP download/unzip reader path or a stable mirrored unzipped TSV path.
  - cities500.txt has no header row; a future facade must pin the published GeoNames column order explicitly.
  - License is CC BY 4.0; every downstream output should attribute GeoNames and cite the selected dump date.
  - 'Smoke blocker: DuckDB v2.0.1 read_csv over https://download.geonames.org/export/dump/cities500.zip reports unsupported ZIP compression.'
