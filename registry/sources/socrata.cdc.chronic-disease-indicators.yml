# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: socrata.cdc.chronic-disease-indicators
name: CDC U.S. Chronic Disease Indicators
status: candidate
source_type: socrata
authority: Centers for Disease Control and Prevention, National Center for Chronic
  Disease Prevention and Health Promotion, Division of Population Health
license_url: https://opendatacommons.org/licenses/odbl/1.0/
attribution: Centers for Disease Control and Prevention, National Center for Chronic
  Disease Prevention and Health Promotion, Division of Population Health; licensed
  under ODbL v1.0.
requirements:
  duckdb_extensions:
  - httpfs
tables:
- id: chronic_disease_indicators
  ref: odd.cdc.latest.chronic_disease_indicators
  description: CDC chronic-disease indicator observations. One row per location, topic,
    question, stratification, and time period in the bounded Socrata sample.
  columns_hint:
    yearstart: Start year for the indicator observation.
    locationabbr: U.S. state or territory abbreviation reported by the dataset.
    topic: Chronic-disease topic grouping.
    question: Indicator question text.
    datavalue: Indicator value; many rows vary by stratification and some values are
      suppressed or null.
    datavalueunit: Unit for datavalue, commonly percent.
  ask_for:
  - year range
  - location abbreviation or geography
  - topic or question filters
  - stratification fields
  - limit
  warnings:
  - ODbL license obligations are explicit in the Socrata metadata; preserve attribution
    and share-alike review when reusing broadly.
  - Dataset is a wide Socrata table with repeated rows across stratifications; filter
    by year, location, topic, and question before broad scans.
  - Facade is a fixed Alaska 2023 validation sample using selected columns, deterministic
    ordering, and a 5000-row cap until ODD supports parameterized Socrata paging.
  - 'Smoke sample: Alaska 2023 rows returned row_count=983, topics=14, questions=48
    on 2026-11-23.'
  validations:
  - id: odd.cdc.latest.chronic_disease_indicators
    description: Compare the CDC Chronic Disease Indicators Socrata facade with the
      direct bounded SODA CSV recipe for a stable Alaska 2023 sample.
    release: latest
    compare: exact
    order_by:
    - row_count
    limit: 1
    direct_sql: "LOAD httpfs;\nSELECT count(*) AS row_count,\n       min(yearstart)\
      \ AS min_year,\n       max(yearstart) AS max_year,\n       count(DISTINCT topic)\
      \ AS topics,\n       count(DISTINCT question) AS questions\nFROM read_csv_auto('https://data.cdc.gov/resource/hksd-2xuw.csv?$select=yearstart,locationabbr,topic,question,datavalue,datavalueunit&$where=yearstart=2023%20AND%20locationabbr=%27AK%27&$order=topic,question&$limit=5000');\n"
    odd_sql: "LOAD open_data_duck;\nATTACH ':memory:' AS odd (TYPE open_data_duck);\n\
      SELECT count(*) AS row_count,\n       min(yearstart) AS min_year,\n       max(yearstart)\
      \ AS max_year,\n       count(DISTINCT topic) AS topics,\n       count(DISTINCT\
      \ question) AS questions\nFROM odd.cdc.latest.chronic_disease_indicators;\n"
release:
  latest:
    method: static-soda-export
    url: https://data.cdc.gov/resource/hksd-2xuw.csv
discovery:
  namespace: odd.cdc.latest
  discover_sql: "SELECT 'chronic_disease_indicators' AS name,\n       'read_csv_auto'\
    \ AS reader,\n       'https://data.cdc.gov/resource/hksd-2xuw.csv?$select=yearstart,locationabbr,topic,question,datavalue,datavalueunit&$where=yearstart=2023%20AND%20locationabbr=%27AK%27&$order=topic,question&$limit=5000'\
    \ AS path;\n"
