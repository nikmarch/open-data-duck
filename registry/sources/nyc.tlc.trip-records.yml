# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: nyc.tlc.trip-records
name: NYC TLC taxi trip records
status: candidate
source_type: parquet
authority: New York City Taxi and Limousine Commission
license_url: https://www.nyc.gov/home/terms-of-use.page
attribution: New York City Taxi and Limousine Commission trip record data; cite NYC TLC and the accessed month.
requirements:
  duckdb_extensions:
  - httpfs
  - parquet
tables:
- id: yellow_tripdata
  ref: odd.nyc_tlc.latest.yellow_tripdata
  description: NYC yellow taxi trip records. One row per yellow taxi trip in the bounded monthly Parquet sample.
  columns_hint:
    VendorID: TLC vendor identifier.
    tpep_pickup_datetime: Trip pickup timestamp.
    tpep_dropoff_datetime: Trip dropoff timestamp.
    passenger_count: Passenger count reported by the vendor.
    trip_distance: Trip distance reported by the meter.
    PULocationID: Taxi zone pickup location identifier.
    DOLocationID: Taxi zone dropoff location identifier.
  ask_for:
  - taxi service type
  - year-month
  - pickup/dropoff geography
  - time window
  - limit
  warnings:
  - The facade is a fixed January 2024 yellow taxi validation sample until ODD supports monthly TLC discovery.
  - Monthly Parquet files are large; filter by date/time and location before broad scans.
  validations:
  - id: odd.nyc_tlc.latest.yellow_tripdata
    description: Compare the NYC TLC January 2024 yellow taxi Parquet sample through direct Parquet and ODD facade reads.
    release: latest
    compare: exact
    order_by:
    - row_count
    limit: 1
    direct_sql: |
      LOAD httpfs;
      SELECT count(*) AS row_count,
             min(tpep_pickup_datetime) AS first_pickup,
             max(tpep_pickup_datetime) AS last_pickup,
             CAST(round(sum(trip_distance), 2) AS DOUBLE) AS trip_distance_sum
      FROM read_parquet('https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet');
    odd_sql: |
      LOAD open_data_duck;
      ATTACH ':memory:' AS odd (TYPE open_data_duck);
      SELECT count(*) AS row_count,
             min(tpep_pickup_datetime) AS first_pickup,
             max(tpep_pickup_datetime) AS last_pickup,
             CAST(round(sum(trip_distance), 2) AS DOUBLE) AS trip_distance_sum
      FROM odd.nyc_tlc.latest.yellow_tripdata;
release:
  latest:
    method: static-monthly-parquet-smoke
    url: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet
discovery:
  namespace: odd.nyc_tlc.latest
  discover_sql: |
    SELECT 'yellow_tripdata' AS name,
           'read_parquet' AS reader,
           'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet' AS path;
