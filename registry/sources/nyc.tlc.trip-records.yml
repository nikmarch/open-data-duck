# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: nyc.tlc.trip-records
name: NYC TLC taxi and for-hire vehicle trip records
status: candidate
source_type: parquet
authority: New York City Taxi and Limousine Commission
license_url: https://www.nyc.gov/home/terms-of-use.page
attribution: Cite the New York City Taxi and Limousine Commission (TLC) as publisher; preserve NYC.gov terms/no-warranty language and do not imply City endorsement.
requirements:
  duckdb_extensions:
  - httpfs
tables:
- id: yellow_tripdata
  ref: odd.nyc_tlc.latest.yellow_tripdata
  description: NYC yellow taxi trip records. One row per yellow taxi trip submitted through TPEP for a published month.
  columns_hint:
    VendorID: TPEP provider/vendor identifier.
    tpep_pickup_datetime: Trip pickup timestamp.
    tpep_dropoff_datetime: Trip drop-off timestamp.
    passenger_count: Driver-reported passenger count where provided.
    trip_distance: Trip distance in miles reported by the taximeter.
    PULocationID: TLC taxi zone pickup location id.
    DOLocationID: TLC taxi zone drop-off location id.
  ask_for:
  - trip type
  - year-month release, or latest complete month
  - pickup or drop-off time range
  - pickup/drop-off taxi zone ids
  - fare, tip, payment, or distance fields needed
  - limit
  warnings:
  - Monthly Parquet files are large; filter by month, time, and taxi zones before broad scans.
  - TLC says trip data was provided by authorized technology providers and TLC makes no representation as to accuracy.
  - For 2025 onward, yellow taxi files include a cbd_congestion_fee column.
  - "Latest release resolves to the newest month where yellow, green, FHV, and high-volume FHV files are all published."
  validations:
  - id: odd.nyc_tlc.latest.yellow_tripdata
    description: Compare the yellow taxi trip facade with the direct public TLC Parquet file for a stable January 2024 sample.
    release: latest
    source_release: 2024-01
    compare: exact
    order_by:
    - tpep_pickup_datetime
    - VendorID
    limit: 5
    direct_sql: |
      LOAD httpfs;
      SELECT VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, trip_distance, PULocationID, DOLocationID
      FROM read_parquet('https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet')
      ORDER BY tpep_pickup_datetime, VendorID
      LIMIT 5;
    odd_sql: |
      LOAD open_data_duck;
      ATTACH ':memory:' AS odd (TYPE open_data_duck);
      SET VARIABLE nyc_tlc_trip_month = '2024-01';
      SELECT VendorID, tpep_pickup_datetime, tpep_dropoff_datetime, trip_distance, PULocationID, DOLocationID
      FROM odd.nyc_tlc.latest.yellow_tripdata
      ORDER BY tpep_pickup_datetime, VendorID
      LIMIT 5;
