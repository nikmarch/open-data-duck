# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: census.pl94-nmf
name: Census 2020 PL94 redistricting noisy measurement file
status: candidate
source_type: parquet
authority: U.S. Census Bureau
license_url: https://creativecommons.org/publicdomain/zero/1.0/
attribution: U.S. Census Bureau 2020 PL 94-171 noisy measurement file; cite the Census product and accessed partition.
requirements:
  duckdb_extensions:
  - httpfs
  - parquet
tables:
- id: person_pl_state_constraint
  ref: odd.census_pl94_nmf.x2020.person_pl_state_constraint
  description: 2020 PL94 person noisy-measurement constraint rows at state geography. One row per query/geocode constraint observation in the bounded Puerto Rico state partition sample.
  columns_hint:
    geocode: Census geography code.
    query_name: Noisy-measurement query name.
    sign: Constraint sign.
    hhgq: Household/group-quarters category.
    votingage: Voting-age category.
    hispanic: Hispanic-origin category.
    cenrace: Census race category.
  ask_for:
  - product family
  - geography level
  - DPQuery or Constraint partition
  - state partition
  warnings:
  - The facade is a fixed 2020 PL94 state Constraint sample until ODD supports partition discovery.
  - Census disclosure-avoidance products are specialist data; explain query semantics before analysis.
  validations:
  - id: odd.census_pl94_nmf.x2020.person_pl_state_constraint
    description: Compare the fixed Census PL94 NMF Parquet partition through direct Parquet and ODD facade reads.
    release: x2020
    source_release: '2020'
    compare: exact
    order_by:
    - row_count
    limit: 1
    direct_sql: |
      LOAD httpfs;
      SELECT count(*) AS row_count,
             min(geocode) AS first_geocode,
             count(DISTINCT query_name) AS query_names
      FROM read_parquet('https://uscb-2020-product-releases.s3.us-west-2.amazonaws.com/decennial/redistricting/2020/nmf/2020-pl94-nmf-state-partitioned/PR_Person_PL_PROD/State.parquet/Constraint/State=072/part-00035-02b20c5e-55c3-46ee-a0da-3e91c0985e2a.c000.snappy.parquet');
    odd_sql: |
      LOAD open_data_duck;
      ATTACH ':memory:' AS odd (TYPE open_data_duck);
      SELECT count(*) AS row_count,
             min(geocode) AS first_geocode,
             count(DISTINCT query_name) AS query_names
      FROM odd.census_pl94_nmf.x2020.person_pl_state_constraint;
release:
  latest:
    method: static-2020-parquet-smoke
    url: https://uscb-2020-product-releases.s3.us-west-2.amazonaws.com/decennial/redistricting/2020/nmf/2020-pl94-nmf-state-partitioned/PR_Person_PL_PROD/State.parquet/Constraint/State=072/part-00035-02b20c5e-55c3-46ee-a0da-3e91c0985e2a.c000.snappy.parquet
discovery:
  namespace: odd.census_pl94_nmf.x2020
  discover_sql: |
    SELECT 'person_pl_state_constraint' AS name,
           'read_parquet' AS reader,
           'https://uscb-2020-product-releases.s3.us-west-2.amazonaws.com/decennial/redistricting/2020/nmf/2020-pl94-nmf-state-partitioned/PR_Person_PL_PROD/State.parquet/Constraint/State=072/part-00035-02b20c5e-55c3-46ee-a0da-3e91c0985e2a.c000.snappy.parquet' AS path;
