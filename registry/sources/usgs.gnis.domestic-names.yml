# Open Data Duck source definition.
# Canonical source files live one-per-file to keep source PRs additive.
id: usgs.gnis.domestic-names
name: USGS GNIS domestic geographic names GeoPackage
status: candidate
source_type: other
authority: U.S. Geological Survey / U.S. Board on Geographic Names
license_url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
attribution: Credit U.S. Geological Survey / U.S. Board on Geographic Names, Geographic
  Names Information System (GNIS), and cite the selected download or refresh date;
  do not imply USGS endorsement.
requirements:
  duckdb_extensions:
  - spatial
tables:
- id: domestic_names
  ref: odd.usgs_gnis.latest.domestic_names
  description: USGS GNIS domestic geographic-name features from the DomesticNames
    GeoPackage layer. One row per official domestic geographic-name feature.
  columns_hint:
    feature_id: Stable GNIS feature identifier.
    feature_name: Official geographic feature name.
    feature_class: GNIS feature class such as Populated Place, Cape, Island, or Sea.
    state_name: State or territory name associated with the feature.
    county_name: County, island, or equivalent local jurisdiction where provided.
    prim_lat_dec: Primary latitude in decimal degrees.
    prim_long_dec: Primary longitude in decimal degrees.
    geom: Geometry from the selected GeoPackage layer.
  ask_for:
  - state or territory
  - national or state/territory extent
  - feature class
  - county or local jurisdiction
  - whether alternate names, history, or federal-code layers are needed
  - limit
  warnings:
  - National GeoPackage ZIP is large; prefer state or territory products for smoke
    tests and interactive queries.
  - GNIS refreshes roughly every other month; cite the download or refresh date used
    for analysis.
  - GeoPackage downloads contain multiple layers; this facade pins the DomesticNames
    layer for the American Samoa smoke product.
  - 'Smoke sample: American Samoa GNIS GeoPackage returned feature_id 1388627 Etena
    and other stable rows on 2026-11-24.'
  validations:
  - id: odd.usgs_gnis.latest.domestic_names
    description: Compare the USGS GNIS DomesticNames facade with the direct public
      American Samoa GeoPackage recipe for stable feature rows.
    release: latest
    source_release: AS
    compare: exact
    order_by:
    - feature_id
    limit: 5
    direct_sql: "LOAD spatial;\nSELECT feature_id, feature_name, feature_class, state_name,\
      \ county_name, prim_lat_dec, prim_long_dec\nFROM ST_Read(\n  '/vsizip/vsicurl/https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/FullModel/Gazetteer_AS_GPKG.zip/Gazetteer_AS_GPKG.gpkg',\n\
      \  layer = 'DomesticNames'\n)\nWHERE feature_id IN (1388627, 1388628, 1388629,\
      \ 1388631, 1388632)\nORDER BY feature_id;\n"
    odd_sql: 'LOAD open_data_duck;

      LOAD spatial;

      ATTACH '':memory:'' AS odd (TYPE open_data_duck);

      SELECT feature_id, feature_name, feature_class, state_name, county_name, prim_lat_dec,
      prim_long_dec

      FROM odd.usgs_gnis.latest.domestic_names

      WHERE feature_id IN (1388627, 1388628, 1388629, 1388631, 1388632)

      ORDER BY feature_id;

      '
release:
  latest:
    method: static-geopackage-smoke
    url: https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/FullModel/Gazetteer_AS_GPKG.zip
discovery:
  namespace: odd.usgs_gnis.latest
  discover_sql: "SELECT 'domestic_names' AS name,\n       'st_read' AS reader,\n \
    \      '/vsizip/vsicurl/https://prd-tnm.s3.amazonaws.com/StagedProducts/GeographicNames/FullModel/Gazetteer_AS_GPKG.zip/Gazetteer_AS_GPKG.gpkg'\
    \ AS path,\n       'DomesticNames' AS layer;\n"
