    topics: [development indicators, population, economy, health, education, country time series]
    coverage:
      spatial: global countries and economies covered by the World Bank Indicators API
      temporal: annual indicator time series, typically 1960 to the most recent World Bank update depending on indicator
      grain: one country-indicator-year observation
    cadence: API metadata reports source-specific last updated dates
    ai:
      summary: Best official source for broad country-level development indicator time series such as population, GDP, health, education, and poverty.
      use_cases: [query country indicator histories, compare development indicators across years, pull WDI time series into DuckDB]
      caveats: [API responses use a two-element JSON envelope, some indicators can have null values, some third-party datasets or indicators may carry different metadata terms]
      prompt_hints: [Ask for country code, indicator id, and year range before generating SQL; use per_page large enough for the selected series.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        WITH payload AS (
          SELECT json
          FROM read_json(
            'https://api.worldbank.org/v2/country/USA/indicator/SP.POP.TOTL?format=json&per_page=20000',
            format = 'auto'
          )
          WHERE json_type(json) = 'ARRAY'
        ), rows AS (
          SELECT e.value AS item
          FROM payload, json_each(payload.json) AS e
        )
        SELECT item->'country'->>'id' AS country_id,
               item->>'countryiso3code' AS iso3,
               item->'indicator'->>'id' AS indicator_id,
               CAST(item->>'date' AS INTEGER) AS year,
               CAST(item->>'value' AS DOUBLE) AS value
        FROM rows
        WHERE item->>'value' IS NOT NULL
        ORDER BY year DESC
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        WITH payload AS (
          SELECT json
          FROM read_json(
            'https://api.worldbank.org/v2/country/USA/indicator/SP.POP.TOTL?format=json&per_page=20000',
            format = 'auto'
          )
          WHERE json_type(json) = 'ARRAY'
        ), rows AS (
          SELECT e.value AS item
          FROM payload, json_each(payload.json) AS e
        )
        SELECT count(*) > 0 AS has_rows,
               max(CAST(item->>'date' AS INTEGER)) >= 2020 AS has_recent_data
        FROM rows
        WHERE item->>'value' IS NOT NULL;
      examples:
        usa_gdp_current_usd: |
          LOAD httpfs;
          WITH payload AS (
            SELECT json
            FROM read_json(
              'https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.MKTP.CD?format=json&per_page=20000',
              format = 'auto'
            )
            WHERE json_type(json) = 'ARRAY'
          ), rows AS (
            SELECT e.value AS item
            FROM payload, json_each(payload.json) AS e
          )
          SELECT CAST(item->>'date' AS INTEGER) AS year,
                 CAST(item->>'value' AS DOUBLE) AS gdp_current_usd
          FROM rows
          WHERE item->>'value' IS NOT NULL
          ORDER BY year DESC
          LIMIT 25;
  - id: bls.cpi.timeseries
    name: BLS Consumer Price Index time series API
    description: Official U.S. Bureau of Labor Statistics Public Data API access to Consumer Price Index time-series observations, queryable as public JSON over HTTPS with DuckDB httpfs.
    status: candidate
    source_type: other
    authority: U.S. Bureau of Labor Statistics
    homepage: https://www.bls.gov/developers/home.htm
    license_url: https://www.bls.gov/developers/termsOfService.htm
    attribution: Cite BLS.gov and the API retrieval date; state that BLS.gov cannot vouch for data or analyses derived after retrieval; do not use the BLS logo or imply BLS sponsorship.
    tables:
      - id: cpi_observations
        description: BLS CPI time-series observations. One row per BLS series and period.
        ask_for: [series id, start year, end year]
        warnings: [Values are returned as strings and should be cast before numeric analysis.]
    tags: [bls, cpi, inflation, labor-statistics, json]
    topics: [consumer price index, inflation, economic indicators, monthly time series]
    coverage:
      spatial: United States CPI areas and item categories available through BLS series ids
      temporal: monthly CPI observations exposed by the public time-series API for the requested series
      grain: one BLS series-period observation
    cadence: CPI series are updated on the BLS release schedule; API responses reflect published BLS time-series data
    ai:
      summary: Official source for CPI inflation time series such as CPI-U all items and core CPI.
      use_cases: [pull recent CPI observations, compare CPI series, build inflation trend examples in DuckDB]
      caveats: [keyless public access should stay to small single-series requests, registered v2 API access is better for multi-series or heavier usage, values are returned as strings and should be cast]
      prompt_hints: [Ask for the BLS series id, CPI item/area, and desired date range; cite the API retrieval date in outputs.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        WITH series AS (
          SELECT unnest(Results.series) AS s
          FROM read_json(
            'https://api.bls.gov/publicAPI/v1/timeseries/data/CUUR0000SA0?startyear=2024&endyear=2025',
            format = 'auto'
          )
        ), observations AS (
          SELECT s.seriesID AS series_id,
                 unnest(s.data) AS obs
          FROM series
        )
        SELECT series_id,
               CAST(obs.year AS INTEGER) AS year,
               obs.period AS period,
               obs.periodName AS period_name,
               TRY_CAST(obs.value AS DOUBLE) AS value
        FROM observations
        WHERE TRY_CAST(obs.value AS DOUBLE) IS NOT NULL
        ORDER BY year DESC, period DESC
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        WITH series AS (
          SELECT unnest(Results.series) AS s
          FROM read_json(
            'https://api.bls.gov/publicAPI/v1/timeseries/data/CUUR0000SA0?startyear=2024&endyear=2025',
            format = 'auto'
          )
        ), observations AS (
          SELECT s.seriesID AS series_id,
                 unnest(s.data) AS obs
          FROM series
        )
        SELECT count(*) > 0 AS has_rows,
               bool_or(series_id = 'CUUR0000SA0') AS has_cpi_all_items_series,
               max(CAST(obs.year AS INTEGER)) >= 2024 AS has_recent_data
        FROM observations
        WHERE TRY_CAST(obs.value AS DOUBLE) IS NOT NULL;
      examples:
        core_cpi_recent_observations: |
          LOAD httpfs;
          WITH series AS (
            SELECT unnest(Results.series) AS s
            FROM read_json(
              'https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SA0L1E?startyear=2024&endyear=2025',
              format = 'auto'
            )
          ), observations AS (
            SELECT s.seriesID AS series_id,
                   unnest(s.data) AS obs
            FROM series
          )
          SELECT series_id,
                 CAST(obs.year AS INTEGER) AS year,
                 obs.periodName AS period_name,
                 TRY_CAST(obs.value AS DOUBLE) AS core_cpi
          FROM observations
          WHERE TRY_CAST(obs.value AS DOUBLE) IS NOT NULL
          ORDER BY year DESC, obs.period DESC
          LIMIT 12;
  - id: openfda.food.enforcement-reports
    name: FDA openFDA food enforcement recall reports
    description: Official openFDA food enforcement recall reports from FDA Recall Enterprise System records, queryable as a public JSON API with DuckDB httpfs.
    status: candidate
    source_type: other
    authority: U.S. Food and Drug Administration openFDA
    homepage: https://open.fda.gov/apis/food/enforcement/
    license_url: https://open.fda.gov/license/
    attribution: Data provided by the U.S. Food and Drug Administration (https://open.fda.gov); openFDA materials are public domain / CC0 unless otherwise noted.
    tables:
      - id: food_enforcement_reports
        description: FDA food enforcement recall reports. One row per public recall report returned from the openFDA food enforcement endpoint after unnesting the JSON results envelope.
        columns_hint:
          recall_number: FDA recall number for the enforcement report.
          status: Recall status, such as Ongoing, Completed, or Terminated.
          classification: Recall classification, such as Class I, Class II, or Class III.
          product_description: Product description text from the recall report.
          recalling_firm: Firm responsible for the recall.
          report_date: FDA report date as YYYYMMDD text.
        ask_for: [classification, status, date window, product or firm search term, limit]
        warnings: [API keys are optional but keyless access can be rate-limited; responses are nested JSON envelopes, so unnest results before treating reports as rows.]
    tags: [fda, openfda, recalls, food-safety, json, public-domain]
    topics: [food recalls, enforcement reports, product safety, public health]
    coverage:
      spatial: United States FDA-regulated food products and firms represented in enforcement records
      temporal: FDA food enforcement recall reports exposed by openFDA, documented from 2004 onward
      grain: one FDA food enforcement recall report after unnesting the API results array
    cadence: openFDA documents food enforcement data updates weekly
    ai:
      summary: Official FDA source for food recall enforcement reports when a user wants recall numbers, classifications, firms, products, and report dates.
      use_cases: [list recent food recalls, filter recalls by classification or status, search product descriptions or recalling firms]
      caveats: [openFDA warns the API is not validated for clinical or production use, keyless requests have lower rate limits, query the nested results array rather than the response envelope]
      prompt_hints: [Ask for classification, recall status, product or firm search terms, date window, and row limit before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        WITH payload AS (
          SELECT *
          FROM read_json(
            'https://api.fda.gov/food/enforcement.json?limit=10',
            format = 'auto'
          )
        ), reports AS (
          SELECT unnest(results) AS report
          FROM payload
        )
        SELECT report.recall_number AS recall_number,
               report.status AS status,
               report.classification AS classification,
               report.product_description AS product_description,
               report.recalling_firm AS recalling_firm,
               report.report_date AS report_date
        FROM reports
        ORDER BY report_date DESC
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        WITH payload AS (
          SELECT *
          FROM read_json(
            'https://api.fda.gov/food/enforcement.json?limit=5',
            format = 'auto'
          )
        ), reports AS (
          SELECT unnest(results) AS report
          FROM payload
        )
        SELECT count(*) > 0 AS has_rows,
               bool_and(report.recall_number IS NOT NULL) AS has_recall_numbers
        FROM reports;
      examples:
        class_i_recent_reports: |
          LOAD httpfs;
          WITH payload AS (
            SELECT *
            FROM read_json(
              'https://api.fda.gov/food/enforcement.json?search=classification:%22Class%20I%22&limit=25',
              format = 'auto'
            )
          ), reports AS (
            SELECT unnest(results) AS report
            FROM payload
          )
          SELECT report.recall_number AS recall_number,
                 report.status AS status,
                 report.product_description AS product_description,
                 report.recalling_firm AS recalling_firm,
                 report.report_date AS report_date
          FROM reports
          ORDER BY report_date DESC
          LIMIT 25;
  - id: treasury.fiscaldata.debt-to-penny
    name: U.S. Treasury Fiscal Data Debt to the Penny API
    description: Official Bureau of the Fiscal Service daily total public debt outstanding records from the Treasury Fiscal Data API, queryable as gzipped CSV over HTTPS with DuckDB httpfs.
    status: candidate
    source_type: other
    authority: U.S. Department of the Treasury, Bureau of the Fiscal Service
    homepage: https://fiscaldata.treasury.gov/datasets/debt-to-the-penny/debt-to-the-penny
    license_url: https://catalog.data.gov/dataset/debt-to-the-penny
    attribution: U.S. Department of the Treasury, Bureau of the Fiscal Service, Fiscal Data / Debt to the Penny; do not imply Treasury endorsement.
    tables:
      - id: debt_observations
        description: U.S. Treasury daily public debt outstanding records. One row per record date.
        ask_for: [date window, debt field, limit]
        warnings: [Fiscal Data CSV responses are gzipped; use compression = 'gzip'.]
    tags: [treasury, fiscal-data, debt, public-debt, csv]
    topics: [federal debt, public debt outstanding, treasury, fiscal data, daily time series]
    coverage:
      spatial: United States federal government fiscal accounts
      temporal: daily public debt outstanding records exposed by the Fiscal Data API
      grain: one record date with total public debt outstanding amounts
    cadence: daily on Treasury Fiscal Data publication schedule
    ai:
      summary: Official source for daily U.S. total public debt outstanding time-series queries.
      use_cases: [pull recent debt-to-the-penny observations, monitor daily public debt changes, join federal debt levels into economic time-series analysis]
      caveats: [Fiscal Data CSV responses are gzipped even though the URL has no .gz suffix, so DuckDB queries must pass compression = 'gzip'; amounts are large dollar values and should be handled as numeric fields]
      prompt_hints: [Ask for the date window and whether the user wants total public debt or intragovernmental/publicly held debt fields before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT record_date,
               tot_pub_debt_out_amt
        FROM read_csv_auto(
          'https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?fields=record_date,tot_pub_debt_out_amt&sort=-record_date&page%5Bsize%5D=10&format=csv',
          compression = 'gzip'
        )
        ORDER BY record_date DESC
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SELECT count(*) > 0 AS has_rows,
               max(record_date) >= DATE '2026-01-01' AS has_recent_data
        FROM read_csv_auto(
          'https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?fields=record_date,tot_pub_debt_out_amt&sort=-record_date&page%5Bsize%5D=10&format=csv',
          compression = 'gzip'
        );
      examples:
        recent_public_debt_changes: |
          LOAD httpfs;
          SELECT record_date,
                 tot_pub_debt_out_amt,
                 tot_pub_debt_out_amt - lag(tot_pub_debt_out_amt) OVER (ORDER BY record_date) AS change_from_previous_record
          FROM read_csv_auto(
            'https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?fields=record_date,tot_pub_debt_out_amt&sort=-record_date&page%5Bsize%5D=30&format=csv',
            compression = 'gzip'
          )
          ORDER BY record_date DESC
          LIMIT 10;
  - id: noaa.ncei.storm-events
    name: NOAA NCEI Storm Events bulk CSV files
    description: Official NOAA National Centers for Environmental Information Storm Events Database bulk CSV exports for severe weather events, fatalities, and locations, queryable from public HTTPS gzip files with DuckDB httpfs.
    status: candidate
    source_type: other
    authority: NOAA National Centers for Environmental Information
    homepage: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
    license_url: https://www.noaa.gov/information-policies-and-instructions/copyrights-and-credits
    attribution: NOAA National Centers for Environmental Information, Storm Events Database; credit NOAA/NCEI and do not imply NOAA endorsement.
    tables:
      - id: storm_events_details
        ref: odd.noaa.latest.storm_events_details
        description: NOAA Storm Events detail rows. One row per reported storm event.
        ask_for: [year, state, event type, limit]
        warnings: [Files are revised with creation-date suffixes; pin year for reproducible examples.]
        validations:
          - id: odd.noaa.latest.storm_events_details
            description: Compare NOAA Storm Events details facade with the direct bulk CSV recipe.
            release: latest
            compare: exact
            order_by: [event_id]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SELECT event_id, state, event_type, begin_date_time, cz_name
              FROM read_csv_auto(
                'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_details-ftp_v1.0_d2024_c20261119.csv.gz',
                sample_size = 20000
              )
              WHERE event_type IS NOT NULL
              ORDER BY event_id
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SET VARIABLE noaa_storm_events_year = '2024';
              SELECT event_id, state, event_type, begin_date_time, cz_name
              FROM odd.noaa.latest.storm_events_details
              WHERE event_type IS NOT NULL
              ORDER BY event_id
              LIMIT 10;
      - id: storm_events_fatalities
        ref: odd.noaa.latest.storm_events_fatalities
        description: NOAA Storm Events fatality rows. One row per fatality associated with a storm event.
        ask_for: [year, state or event id, limit]
        warnings: [Join to details by event_id for event context.]
        validations:
          - id: odd.noaa.latest.storm_events_fatalities
            description: Compare NOAA Storm Events fatalities facade with the direct bulk CSV recipe.
            release: latest
            compare: exact
            order_by: [fatality_id]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SELECT fatality_id, event_id, fatality_type, fatality_date, fatality_age
              FROM read_csv_auto(
                'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_fatalities-ftp_v1.0_d2024_c20261119.csv.gz',
                sample_size = 20000
              )
              WHERE event_id IS NOT NULL
              ORDER BY fatality_id
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SET VARIABLE noaa_storm_events_year = '2024';
              SELECT fatality_id, event_id, fatality_type, fatality_date, fatality_age
              FROM odd.noaa.latest.storm_events_fatalities
              WHERE event_id IS NOT NULL
              ORDER BY fatality_id
              LIMIT 10;
      - id: storm_events_locations
        ref: odd.noaa.latest.storm_events_locations
        description: NOAA Storm Events location rows. One row per location attached to a storm event.
        ask_for: [year, state or event id, limit]
        warnings: [Join to details by event_id for event context.]
        validations:
          - id: odd.noaa.latest.storm_events_locations
            description: Compare NOAA Storm Events locations facade with the direct bulk CSV recipe.
            release: latest
            compare: exact
            order_by: [event_id, location_index]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SELECT event_id, location_index, location, latitude, longitude
              FROM read_csv_auto(
                'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_locations-ftp_v1.0_d2024_c20261119.csv.gz',
                sample_size = 20000
              )
              WHERE event_id IS NOT NULL
              ORDER BY event_id, location_index
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SET VARIABLE noaa_storm_events_year = '2024';
              SELECT event_id, location_index, location, latitude, longitude
              FROM odd.noaa.latest.storm_events_locations
              WHERE event_id IS NOT NULL
              ORDER BY event_id, location_index
              LIMIT 10;
    tags: [noaa, ncei, storms, weather, hazards, csv]
    topics: [severe weather, storm reports, tornadoes, hail, wind, fatalities]
    coverage:
      spatial: United States and U.S. territories covered by NOAA Storm Events reports
      temporal: annual data-year bulk CSV exports
      grain: storm event, fatality, or event-location row depending on the selected table
    cadence: bulk files are revised with new creation-date suffixes as NOAA/NCEI republishes each data year
    ai:
      summary: Official bulk file source for historical U.S. severe weather event analysis in DuckDB.
      use_cases: [query storm events by state and event type, inspect tornado or hail reports by year, join event details to fatalities or locations]
      caveats: [file names include both data year and NOAA creation-date suffix, latest table discovery scans the directory listing to choose the newest suffix per file family, CSV files can be large]
      prompt_hints: [Ask for data year, event type, and state before generating SQL; pin noaa_storm_events_year for reproducible table-facade queries.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT event_id,
               state,
               event_type,
               begin_date_time,
               cz_name
        FROM read_csv_auto(
          'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_details-ftp_v1.0_d2024_c20261119.csv.gz',
          sample_size = 20000
        )
        WHERE event_type IS NOT NULL
        ORDER BY event_id
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SELECT count(*) > 0 AS ok
        FROM read_csv_auto(
          'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/StormEvents_details-ftp_v1.0_d2024_c20261119.csv.gz',
          sample_size = 20000
        )
        WHERE event_id IS NOT NULL
          AND event_type IS NOT NULL;
      examples:
        latest_details_by_state_type: |
          LOAD httpfs;
          SET VARIABLE noaa_storm_events_year = '2024';
          SELECT event_id, state, event_type, begin_date_time, cz_name
          FROM odd.noaa.latest.storm_events_details
          WHERE state = 'ALASKA'
            AND event_type IS NOT NULL
          ORDER BY begin_date_time
          LIMIT 25;
        latest_fatalities_by_year: |
          LOAD httpfs;
          SET VARIABLE noaa_storm_events_year = '2024';
          SELECT fatality_id, event_id, fatality_type, fatality_date, fatality_age
          FROM odd.noaa.latest.storm_events_fatalities
          ORDER BY fatality_date
          LIMIT 25;
      tables:
        namespace: odd.noaa.latest
        discover_sql: |
          WITH files AS (
            SELECT regexp_extract(m, 'StormEvents_([a-z]+)-ftp_v1\.0_d{release}_c([0-9]{8})\.csv\.gz', 1) AS table_kind,
                   regexp_extract(m, '(StormEvents_[a-z]+-ftp_v1\.0_d{release}_c[0-9]{8}\.csv\.gz)', 1) AS file_name,
                   regexp_extract(m, '_c([0-9]{8})\.csv\.gz', 1) AS created
            FROM (SELECT DISTINCT unnest(regexp_extract_all(content, 'StormEvents_[a-z]+-ftp_v1\.0_d{release}_c[0-9]{8}\.csv\.gz')) AS m
                  FROM read_text('https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/'))
          ), latest AS (
            SELECT table_kind, max(created) AS created
            FROM files
            GROUP BY table_kind
          )
          SELECT 'storm_events_' || files.table_kind AS name,
                 'read_csv' AS reader,
                 'https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/' || files.file_name AS path
          FROM files
          JOIN latest USING (table_kind, created)
          ORDER BY name;
    release:
      latest:
        method: html-listing
        url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
        resolve_sql: |
          SELECT max(regexp_extract(m, 'StormEvents_details-ftp_v1\.0_d([0-9]{4})_c[0-9]{8}\.csv\.gz', 1)) AS release
          FROM (SELECT unnest(regexp_extract_all(content, 'StormEvents_details-ftp_v1\.0_d[0-9]{4}_c[0-9]{8}\.csv\.gz')) AS m
                FROM read_text('https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/'));
      pinned:
        duckdb_setting: noaa_storm_events_year
        example: "2024"
