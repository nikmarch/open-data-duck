      summary: Station-day climate observations suitable for DuckDB CSV scans from public S3 HTTPS URLs.
      use_cases: [analyze daily station observations, compare precipitation or temperature by year]
      caveats: [CSV files are large; filter by year/station/element early]
      prompt_hints: [Ask for year, station IDs, and climate elements before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT id, date, element, data_value
        FROM read_csv_auto('https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_year/2024.csv')
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM read_csv_auto('https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_year/2024.csv')
        LIMIT 1;
      tables:
        namespace: odd.noaa.latest
        discover_sql: |
          SELECT 'ghcn_daily' AS name,
                 'read_csv' AS reader,
                 'https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_year/{release}.csv' AS path;
    release:
      latest:
        method: s3-listing
        url: https://noaa-ghcn-pds.s3.amazonaws.com/?list-type=2&prefix=csv/by_year/
        resolve_sql: |
          SELECT max(regexp_extract(m, '([0-9]{4})\.csv', 1)) AS release
          FROM (SELECT unnest(regexp_extract_all(content, 'by_year/[0-9]{4}\.csv')) AS m
                FROM read_text('https://noaa-ghcn-pds.s3.amazonaws.com/?list-type=2&prefix=csv/by_year/'));
      pinned:
        duckdb_setting: noaa_ghcn_year
        example: "2024"
