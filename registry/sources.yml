  - id: arcgis.census.tigerweb.state-county
    name: U.S. Census TIGERweb state and county layers
    description: Census TIGERweb ArcGIS layers for U.S. state and county boundaries, useful once ArcGIS paging is available in the DuckDB path.
    status: connector-blocked
    source_type: arcgis
    authority: U.S. Census Bureau
    homepage: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer
    license_url: https://www.census.gov/data/developers/about/terms-of-service.html
    attribution: U.S. Census Bureau TIGERweb.
    tags: [arcgis, census, boundaries, us]
    topics: [administrative boundaries, counties, states]
    coverage:
      spatial: United States
      temporal: current TIGERweb service state
      grain: ArcGIS layer features
    cadence: Census service updates
    ai:
      summary: Authoritative U.S. boundary service, currently blocked on stable DuckDB ArcGIS connector packaging.
      use_cases: [join data to county boundaries, inspect state and county geometries]
      caveats: [connector is blocked; use REST pagination path until extension install is reliable]
      prompt_hints: [Mention connector-blocked status and prefer REST pagination planning.]
    duckdb:
      extensions:
        - arcgis
      install: |
        -- connector-blocked: duckdb-arcgis is not in DuckDB community extensions.
        -- Current releases install from unsigned exact-version binaries.
        -- Open DuckDB with allow_unsigned_extensions before installing a release file.
      example_query: |
        -- Future duckdb-arcgis shape once the connector has a stable install path.
        LOAD arcgis;
        SELECT *
        FROM arcgis_query('https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1')
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM arcgis_query('https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1');
    freshness:
      method: arcgis-layer-metadata
      url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1?f=pjson

  - id: census.cartographic.county-boundaries
    name: U.S. Census cartographic county boundary files
    description: Official generalized U.S. county boundary shapefiles from the Census Bureau Cartographic Boundary Files collection, queryable directly from the public zipped shapefile with DuckDB spatial/GDAL virtual file paths.
    status: candidate
    source_type: other
    authority: U.S. Census Bureau Geography Program
    homepage: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    license_url: https://www.census.gov/data/developers/about/terms-of-service.html
    attribution: U.S. Census Bureau Geography Program, Cartographic Boundary Files; cite the selected year and scale and do not imply Census Bureau endorsement.
    tags: [census, boundaries, counties, shapefile, geospatial]
    topics: [administrative boundaries, counties, thematic mapping, fips]
    coverage:
      spatial: United States counties and equivalent entities
      temporal: annual cartographic boundary file vintages
      grain: one generalized county or county-equivalent polygon feature
    cadence: annual Census cartographic boundary file releases
    ai:
      summary: Best direct-file Census county boundary source for joining county-level data to generalized polygons in DuckDB.
      use_cases: [map county-level indicators, join county FIPS codes to generalized boundaries, build thematic maps without TIGERweb paging]
      caveats: [generalized for thematic mapping rather than surveying, choose year and scale explicitly, zipped shapefile access requires DuckDB spatial/GDAL virtual paths]
      prompt_hints: [Ask for the boundary vintage, generalized scale, and whether county GEOID/FIPS is enough before generating SQL.]
    duckdb:
      extensions:
        - spatial
      install: |
        INSTALL spatial;
      example_query: |
        LOAD spatial;

        SELECT GEOID, NAME, STATE_NAME, ST_GeometryType(geom) AS geom_type
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp')
        LIMIT 10;
      validation_query: |
        LOAD spatial;

        SELECT count(*) = 3222 AS ok
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp');
      examples:
        alaska_counties_2025_20m: |
          LOAD spatial;

          SELECT GEOID, NAME, LSAD, ST_AsText(ST_Centroid(geom)) AS centroid_wkt
          FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp')
          WHERE STATEFP = '02'
          ORDER BY GEOID;
      tables:
        namespace: odd.census.latest
        # Every county shapefile of the release at every published scale (20m, 5m, 500k, ...).
        discover_sql: |
          SELECT regexp_extract(z, 'cb_{release}_us_(.+)\.zip', 1) AS name,
                 'st_read' AS reader,
                 '/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ{release}/shp/' || z || '/' || replace(z, '.zip', '.shp') AS path
          FROM (SELECT DISTINCT unnest(regexp_extract_all(content, 'cb_{release}_us_county[a-z0-9_]*\.zip')) AS z
                FROM read_text('https://www2.census.gov/geo/tiger/GENZ{release}/shp/'));
    release:
      latest:
        method: html-listing
        url: https://www2.census.gov/geo/tiger/
        resolve_sql: |
          SELECT max(regexp_extract(m, 'GENZ([0-9]{4})', 1)) AS release
          FROM (SELECT unnest(regexp_extract_all(content, 'GENZ[0-9]{4}')) AS m
                FROM read_text('https://www2.census.gov/geo/tiger/'));
      pinned:
        duckdb_setting: census_cartographic_year
        example: "2025"
    freshness:
      method: census-cartographic-boundary-files-page
      url: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html

  - id: census.cartographic.tract-boundaries
    name: U.S. Census cartographic tract boundary files
    description: Official generalized U.S. census tract boundary shapefiles from the Census Bureau Cartographic Boundary Files collection, queryable directly from the public zipped shapefile with DuckDB spatial/GDAL virtual file paths.
    status: candidate
    source_type: other
    authority: U.S. Census Bureau Geography Program
    homepage: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    license_url: https://www.census.gov/data/developers/about/terms-of-service.html
    attribution: U.S. Census Bureau Geography Program, Cartographic Boundary Files; cite the selected year and scale and do not imply Census Bureau endorsement.
    tags: [census, boundaries, tracts, shapefile, geospatial]
    topics: [census tracts, statistical geographies, thematic mapping, geoid, fips]
    coverage:
      spatial: United States census tracts
      temporal: annual cartographic boundary file vintages
      grain: one generalized census tract polygon feature
    cadence: annual Census cartographic boundary file releases
    ai:
      summary: Best direct-file Census tract boundary source for joining tract-level ACS or public-health data to generalized polygons in DuckDB.
      use_cases: [map tract-level indicators, join tract GEOIDs to ACS estimates, build thematic maps without TIGERweb paging]
      caveats: [generalized for thematic mapping rather than surveying, choose year and scale explicitly, national tract files are larger than county files, zipped shapefile access requires DuckDB spatial/GDAL virtual paths]
      prompt_hints: [Ask for the boundary vintage, generalized scale, state filter, and tract-level GEOID join key before generating SQL.]
    duckdb:
      extensions:
        - spatial
      install: |
        INSTALL spatial;
      example_query: |
        LOAD spatial;

        SELECT GEOID, NAME, STATEFP, COUNTYFP, ST_GeometryType(geom) AS geom_type
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_tract_5m.zip/cb_2025_us_tract_5m.shp')
        WHERE STATEFP = '02'
        LIMIT 10;
      validation_query: |
        LOAD spatial;

        SELECT count(*) = 85187 AS ok
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_tract_5m.zip/cb_2025_us_tract_5m.shp');
      examples:
