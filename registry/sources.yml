  - id: arcgis.census.tigerweb.state-county
    name: U.S. Census TIGERweb state and county layers
    description: Census TIGERweb ArcGIS layers for U.S. state and county boundaries, useful once ArcGIS paging is available in the DuckDB path.
    status: connector-blocked
    source_type: arcgis
    authority: U.S. Census Bureau
    homepage: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer
    license_url: https://www.census.gov/data/developers/about/terms-of-service.html
    attribution: U.S. Census Bureau TIGERweb.
    tags: [arcgis, census, boundaries, us]
    topics: [administrative boundaries, counties, states]
    coverage:
      spatial: United States
      temporal: current TIGERweb service state
      grain: ArcGIS layer features
    cadence: Census service updates
    ai:
      summary: Authoritative U.S. boundary service, currently blocked on stable DuckDB ArcGIS connector packaging.
      use_cases: [join data to county boundaries, inspect state and county geometries]
      caveats: [connector is blocked; use REST pagination path until extension install is reliable]
      prompt_hints: [Mention connector-blocked status and prefer REST pagination planning.]
    duckdb:
      extensions:
        - arcgis
      install: |
        -- connector-blocked: duckdb-arcgis is not in DuckDB community extensions.
        -- Current releases install from unsigned exact-version binaries.
        -- Open DuckDB with allow_unsigned_extensions before installing a release file.
      example_query: |
        -- Future duckdb-arcgis shape once the connector has a stable install path.
        LOAD arcgis;
        SELECT *
        FROM arcgis_query('https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1')
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM arcgis_query('https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1');
    freshness:
      method: arcgis-layer-metadata
      url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1?f=pjson

