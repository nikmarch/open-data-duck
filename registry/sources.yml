  - id: census.cartographic.county-boundaries
    name: U.S. Census cartographic county boundary files
    description: Official generalized U.S. county boundary shapefiles from the Census Bureau Cartographic Boundary Files collection, queryable directly from the public zipped shapefile with DuckDB spatial/GDAL virtual file paths.
    status: candidate
    source_type: other
    authority: U.S. Census Bureau Geography Program
    homepage: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    license_url: https://www.census.gov/data/developers/about/terms-of-service.html
    attribution: U.S. Census Bureau Geography Program, Cartographic Boundary Files; cite the selected year and scale and do not imply Census Bureau endorsement.
    tables:
      - id: county_20m
        ref: odd.census.latest.county_20m
        description: Generalized U.S. county polygons at 20m scale. One row per county or county-equivalent feature.
        ask_for: [year, scale, state filter, GEOID join key]
        warnings: [Generalized for thematic mapping, not surveying.]
        validations:
          - id: odd.census.latest.county_20m
            description: Compare the latest Census county boundary facade with the direct zipped shapefile recipe.
            release: latest
            compare: exact
            order_by: [GEOID]
            limit: 10
            direct_sql: |
              LOAD spatial;
              SELECT GEOID, NAME, STATE_NAME, ST_GeometryType(geom) AS geom_type
              FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp')
              WHERE STATEFP = '02'
              ORDER BY GEOID
              LIMIT 10;
            odd_sql: |
              LOAD spatial;
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SET VARIABLE census_cartographic_year = '2025';
              SELECT GEOID, NAME, STATE_NAME, ST_GeometryType(geom) AS geom_type
              FROM odd.census.latest.county_20m
              WHERE STATEFP = '02'
              ORDER BY GEOID
              LIMIT 10;
    tags: [census, boundaries, counties, shapefile, geospatial]
    topics: [administrative boundaries, counties, thematic mapping, fips]
    coverage:
      spatial: United States counties and equivalent entities
      temporal: annual cartographic boundary file vintages
      grain: one generalized county or county-equivalent polygon feature
    cadence: annual Census cartographic boundary file releases
    ai:
      summary: Best direct-file Census county boundary source for joining county-level data to generalized polygons in DuckDB.
      use_cases: [map county-level indicators, join county FIPS codes to generalized boundaries, build thematic maps without TIGERweb paging]
      caveats: [generalized for thematic mapping rather than surveying, choose year and scale explicitly, zipped shapefile access requires DuckDB spatial/GDAL virtual paths]
      prompt_hints: [Ask for the boundary vintage, generalized scale, and whether county GEOID/FIPS is enough before generating SQL.]
    duckdb:
      extensions:
        - spatial
      install: |
        INSTALL spatial;
      example_query: |
        LOAD spatial;

        SELECT GEOID, NAME, STATE_NAME, ST_GeometryType(geom) AS geom_type
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp')
        LIMIT 10;
      validation_query: |
        LOAD spatial;

        SELECT count(*) = 3222 AS ok
        FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp');
      examples:
        alaska_counties_2025_20m: |
          LOAD spatial;

          SELECT GEOID, NAME, LSAD, ST_AsText(ST_Centroid(geom)) AS centroid_wkt
          FROM ST_Read('/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_us_county_20m.zip/cb_2025_us_county_20m.shp')
          WHERE STATEFP = '02'
          ORDER BY GEOID;
      tables:
        namespace: odd.census.latest
        # Every county shapefile of the release at every published scale (20m, 5m, 500k, ...).
        discover_sql: |
          SELECT regexp_extract(z, 'cb_{release}_us_(.+)\.zip', 1) AS name,
                 'st_read' AS reader,
                 '/vsizip/vsicurl/https://www2.census.gov/geo/tiger/GENZ{release}/shp/' || z || '/' || replace(z, '.zip', '.shp') AS path
          FROM (SELECT DISTINCT unnest(regexp_extract_all(content, 'cb_{release}_us_county[a-z0-9_]*\.zip')) AS z
                FROM read_text('https://www2.census.gov/geo/tiger/GENZ{release}/shp/'));
    release:
      latest:
        method: html-listing
        url: https://www2.census.gov/geo/tiger/
        resolve_sql: |
          SELECT max(regexp_extract(m, 'GENZ([0-9]{4})', 1)) AS release
          FROM (SELECT unnest(regexp_extract_all(content, 'GENZ[0-9]{4}')) AS m
                FROM read_text('https://www2.census.gov/geo/tiger/'));
      pinned:
        duckdb_setting: census_cartographic_year
        example: "2025"
