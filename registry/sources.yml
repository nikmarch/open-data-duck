      - id: address
        ref: odd.overturemaps.latest.address
        description: Address point/record features. One row per Overture address feature.
        ask_for: [bbox or area, release or latest, limit]
        warnings: [Large global table; always use tight bbox filters.]
        validations:
          - id: odd.overturemaps.latest.address
            description: Compare the latest Overture addresses facade with the direct public S3 parquet recipe over a sampled tiny bbox.
            release: latest
            compare: exact
            order_by: [id]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SET s3_region='us-west-2';
              SET VARIABLE overture_release = '2026-10-21.0';
              SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

              SELECT id, bbox
              FROM read_parquet(
                getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=addresses/type=address/*'
              )
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SET VARIABLE overture_release = '2026-10-21.0';
              SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';
              SELECT id, bbox
              FROM odd.overturemaps.latest.address
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
    tags: [maps, geospatial, places, buildings, transportation, addresses]
    topics: [basemaps, points of interest, buildings, addresses, roads, geocoding]
    coverage:
      spatial: global
      temporal: release snapshots
      grain: theme/type partitioned parquet files
    cadence: monthly releases
    ai:
      summary: Best default source for broad global map features when DuckDB can query public S3.
      use_cases: [find places in a bounding box, inspect global building footprints, sample road segments, query address points, compare map releases]
      caveats: [large files require tight spatial filters, attribution varies by contributing provider, release paths should be pinned for reproducible workflows]
      prompt_hints: [Ask for the Overture theme/type, release, and bounding box before generating SQL.]
    release:
      latest:
        method: stac-catalog
        url: https://stac.overturemaps.org/catalog.json
        # The extension runs this once per process on the first `latest` table
        # query and caches the result. SET VARIABLE overture_release = '...' pins instead.
        resolve_sql: |
          SELECT regexp_extract(l.href, '/([0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+)/catalog\.json$', 1) AS release
          FROM (SELECT unnest(links) AS l FROM read_json('https://stac.overturemaps.org/catalog.json'))
          WHERE l.rel = 'child' AND l.latest;
      pinned:
        duckdb_setting: overture_release
        s3_base_setting: overture_s3_base
        example: "2026-10-21.0"
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SET s3_region='us-west-2';
        SET VARIABLE overture_release = '2026-10-21.0';
        SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

        -- Direct public S3 recipe. The future open_data_duck extension should wrap
        -- this release/path logic instead of relying on a separate Overture plugin.
        SELECT *
        FROM read_parquet(
          getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
          hive_partitioning = true
        )
        WHERE bbox.xmin <= -149
          AND bbox.xmax >= -150
          AND bbox.ymin <= 61
          AND bbox.ymax >= 60
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SET s3_region='us-west-2';
        SET VARIABLE overture_release = '2026-10-21.0';
        SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

        SELECT count(*) >= 0 AS small_bbox_query_ok
        FROM read_parquet(
          getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
          hive_partitioning = true
        )
        WHERE bbox.xmin <= -149
          AND bbox.xmax >= -150
          AND bbox.ymin <= 61
          AND bbox.ymax >= 60
        LIMIT 1;
      examples:
        places_bbox_direct_s3: |
          LOAD httpfs;
          SET s3_region='us-west-2';
          SET VARIABLE overture_release = '2026-10-21.0';
          SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

          SELECT *
          FROM read_parquet(
            getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
            hive_partitioning = true
          )
          WHERE bbox.xmin <= -149
            AND bbox.xmax >= -150
            AND bbox.ymin <= 61
            AND bbox.ymax >= 60
          LIMIT 10;
        buildings_bbox_direct_s3: |
          LOAD httpfs;
          SET s3_region='us-west-2';
          SET VARIABLE overture_release = '2026-10-21.0';
          SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

          SELECT *
          FROM read_parquet(
            getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=buildings/type=building/*',
            hive_partitioning = true
          )
          WHERE bbox.xmin <= -149
            AND bbox.xmax >= -150
            AND bbox.ymin <= 61
            AND bbox.ymax >= 60
          LIMIT 10;
        road_segments_bbox_direct_s3: |
          LOAD httpfs;
          SET s3_region='us-west-2';
          SET VARIABLE overture_release = '2026-10-21.0';
          SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

          SELECT *
          FROM read_parquet(
            getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=transportation/type=segment/*',
            hive_partitioning = true
          )
          WHERE bbox.xmin <= -149
            AND bbox.xmax >= -150
            AND bbox.ymin <= 61
            AND bbox.ymax >= 60
          LIMIT 10;
        addresses_bbox_direct_s3: |
          LOAD httpfs;
          SET s3_region='us-west-2';
          SET VARIABLE overture_release = '2026-10-21.0';
          SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

          SELECT *
          FROM read_parquet(
            getvariable('overture_s3_base') || '/release/' || getvariable('overture_release') || '/theme=addresses/type=address/*',
            hive_partitioning = true
          )
          WHERE bbox.xmin <= -149
            AND bbox.xmax >= -150
            AND bbox.ymin <= 61
            AND bbox.ymax >= 60
          LIMIT 10;
      tables:
        namespace: odd.overturemaps.latest
        # One table per STAC collection of the release; paths come from the
        # collection assets, so nothing here lists themes or S3 prefixes by hand.
        discover_sql: |
          SELECT collection AS name,
                 'read_parquet' AS reader,
                 regexp_replace(regexp_replace(min(assets.aws.href), '^https://([^.]+)\.s3\.[^/]+/', 's3://\1/'), '/part-[^/]+$', '/*') AS path
          FROM read_parquet('https://stac.overturemaps.org/{release}/collections.parquet')
          GROUP BY collection;
  - id: naturalearth.admin0-countries
    name: Natural Earth Admin 0 countries
    description: Public-domain generalized country and sovereignty polygons from Natural Earth's 1:110m Admin 0 countries layer, queryable directly from the zipped shapefile with DuckDB spatial/GDAL virtual file paths.
    status: candidate
    source_type: other
    authority: Natural Earth
    homepage: https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/
    license_url: https://www.naturalearthdata.com/about/terms-of-use/
    attribution: "Natural Earth public-domain map data; optional credit: Made with Natural Earth."
    tables:
      - id: countries_110m
        ref: odd.naturalearth.latest.countries_110m
        description: Generalized Admin 0 country polygons at 1:110m scale. One row per country or country-like map unit in the Natural Earth countries layer.
        columns_hint:
          NAME: Display name for the country or map unit.
          ISO_A3: Three-letter ISO-style country code where assigned.
          CONTINENT: Continent grouping from Natural Earth.
          POP_EST: Estimated population attribute from Natural Earth.
          geom: Generalized polygon or multipolygon geometry.
        ask_for: [scale, whether de facto boundaries are acceptable, country or sovereignty fields, limit]
        warnings:
          - Natural Earth is cartographic generalized data for small-scale maps, not legal or survey boundaries.
          - The Admin 0 countries layer uses de facto boundaries by default; choose a different Natural Earth Admin 0 product if map units, sovereignty, or disputed areas matter.
        validations:
          - id: odd.naturalearth.latest.countries_110m
            description: Compare the Natural Earth Admin 0 countries facade with the direct zipped shapefile recipe for two stable country rows.
            release: latest
            compare: exact
            order_by: [ISO_A3]
            limit: 2
            direct_sql: |
              LOAD spatial;
              SELECT NAME, ISO_A3, CONTINENT, POP_EST
              FROM ST_Read('/vsizip/vsicurl/https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip/ne_110m_admin_0_countries.shp')
              WHERE ISO_A3 IN ('USA', 'UZB')
              ORDER BY ISO_A3;
            odd_sql: |
              LOAD spatial;
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SELECT NAME, ISO_A3, CONTINENT, POP_EST
              FROM odd.naturalearth.latest.countries_110m
              WHERE ISO_A3 IN ('USA', 'UZB')
              ORDER BY ISO_A3;
    tags: [natural-earth, countries, boundaries, shapefile, geospatial]
    topics: [country boundaries, world maps, administrative boundaries, cartography, choropleth joins]
    coverage:
      spatial: global country and country-like map units
      temporal: Natural Earth release snapshot served by the current 110m download
      grain: one generalized Admin 0 country or map unit polygon
    cadence: Natural Earth versioned releases update occasionally
    ai:
      summary: Best lightweight public-domain country-boundary source for small-scale world maps and quick ISO_A3 joins in DuckDB.
      use_cases: [draw world country maps, join country-level indicators by ISO_A3, build small geospatial smoke tests]
      caveats: [generalized for small-scale cartography, not authoritative legal boundaries, de facto country boundaries may not match all political requirements]
      prompt_hints: [Ask whether 110m generalized boundaries are sufficient and whether de facto boundaries are acceptable before generating SQL.]
    release:
      latest:
        method: static-download
        url: https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip
        resolve_sql: |
          SELECT regexp_extract('https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip', '/naturalearth/([0-9]+m)/', 1) AS release;
      pinned:
        duckdb_setting: naturalearth_scale
        example: 110m
    duckdb:
      extensions:
        - spatial
      install: |
        INSTALL spatial;
      example_query: |
        LOAD spatial;

        SELECT NAME, ISO_A3, CONTINENT, POP_EST
        FROM ST_Read('/vsizip/vsicurl/https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip/ne_110m_admin_0_countries.shp')
        WHERE ISO_A3 IN ('USA', 'UZB')
        ORDER BY ISO_A3;
      validation_query: |
        LOAD spatial;

        SELECT count(*) = 177 AS ok
        FROM ST_Read('/vsizip/vsicurl/https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip/ne_110m_admin_0_countries.shp');
      examples:
        countries_by_continent: |
          LOAD spatial;

          SELECT NAME, ISO_A3, POP_EST
          FROM ST_Read('/vsizip/vsicurl/https://naciscdn.org/naturalearth/110m/cultural/ne_110m_admin_0_countries.zip/ne_110m_admin_0_countries.shp')
          WHERE CONTINENT = 'Asia'
          ORDER BY NAME
          LIMIT 25;
      tables:
        namespace: odd.naturalearth.latest
        discover_sql: |
          SELECT 'countries_{release}' AS name,
                 'st_read' AS reader,
                 '/vsizip/vsicurl/https://naciscdn.org/naturalearth/{release}/cultural/ne_{release}_admin_0_countries.zip/ne_{release}_admin_0_countries.shp' AS path;
  - id: stac.earth-search.aws
    name: Earth Search STAC API
    description: Element 84 STAC API for cloud-optimized geospatial imagery, especially Sentinel collections hosted in the AWS open data ecosystem.
    status: candidate
    source_type: stac
    authority: Element 84 / AWS Open Data ecosystem
    homepage: https://earth-search.aws.element84.com/v1
    license_url: https://registry.opendata.aws/sentinel-2-l2a-cogs/
    attribution: Dataset-specific attribution required; verify per collection.
    tables:
      - id: stac_items
        description: STAC item search results from Earth Search. One row per imagery item returned by the STAC API.
        ask_for: [collection, bbox, date range, cloud cover, limit]
        warnings: [Assets can be large; inspect metadata before reading imagery assets.]
    tags: [stac, imagery, aws, sentinel]
    topics: [satellite imagery, earth observation, cloud optimized geotiff]
    coverage:
      spatial: global where source collections are available
      temporal: collection-specific acquisition dates
      grain: STAC item and asset metadata
    cadence: collection-specific updates
    ai:
      summary: Good STAC search target for AWS-hosted earth observation assets.
      use_cases: [discover Sentinel scenes, filter imagery by bounding box and date, inspect asset URLs]
      caveats: [license and attribution are collection-specific, assets may be large]
      prompt_hints: [Ask for collection, date range, cloud cover, and bbox before generating SQL.]
    duckdb:
      extensions:
        - httpfs
        - spatial
        - stac
      install: |
        INSTALL httpfs;
        INSTALL spatial;
        INSTALL stac FROM community;
      example_query: |
        LOAD httpfs;
        LOAD spatial;
        LOAD stac;
        SELECT collection, id, bbox
        FROM STAC_Search('https://earth-search.aws.element84.com/v1/search', max_items := 10)
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM STAC_Collections('https://earth-search.aws.element84.com/v1');
