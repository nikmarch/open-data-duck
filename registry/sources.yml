# Open Data Duck seed registry.
# Status values: candidate, connector-blocked, verified, deprecated.

sources:
  - id: overture.maps.release
    name: Overture Maps source family
    description: Global open map data releases for places, buildings, transportation, divisions, and base layers queryable from public S3 with DuckDB httpfs.
    status: candidate
    source_type: overture
    authority: Overture Maps Foundation
    homepage: https://docs.overturemaps.org/getting-data/
    license_url: https://docs.overturemaps.org/attribution/
    attribution: Overture Maps Foundation and contributing data providers.
    tags: [maps, geospatial, places, buildings, transportation]
    topics: [basemaps, points of interest, administrative boundaries, roads]
    coverage:
      spatial: global
      temporal: release snapshots
      grain: theme/type partitioned parquet files
    cadence: monthly releases
    ai:
      summary: Best default source for broad global map features when DuckDB can query public S3.
      use_cases: [find places in a bounding box, inspect global building footprints, compare map releases]
      caveats: [large files require tight spatial filters, attribution varies by contributing provider]
      prompt_hints: [Ask for the Overture theme/type and a bounding box before generating SQL.]
    release:
      latest:
        method: release-calendar
        url: https://docs.overturemaps.org/release-calendar/
      pinned:
        duckdb_setting: overture_release
        s3_base_setting: overture_s3_base
        example: "2026-03-18.0"
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SET s3_region='us-west-2';
        SET VARIABLE overture_release = '2026-03-18.0';

        -- Direct public S3 recipe. The future open_data_duck extension should wrap
        -- this release/path logic instead of relying on a separate Overture plugin.
        SELECT id, names.primary AS name, bbox
        FROM read_parquet(
          's3://overturemaps-us-west-2/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
          hive_partitioning = true
        )
        WHERE bbox.xmin <= -149
          AND bbox.xmax >= -150
          AND bbox.ymin <= 61
          AND bbox.ymax >= 60
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SET s3_region='us-west-2';
        SET VARIABLE overture_release = '2026-03-18.0';

        SELECT count(*) >= 0 AS small_bbox_query_ok
        FROM read_parquet(
          's3://overturemaps-us-west-2/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
          hive_partitioning = true
        )
        WHERE bbox.xmin <= -149
          AND bbox.xmax >= -150
          AND bbox.ymin <= 61
          AND bbox.ymax >= 60
        LIMIT 1;
      examples:
        places_direct_s3: |
          LOAD httpfs;
          SET s3_region='us-west-2';
          SET VARIABLE overture_release = '2026-03-18.0';

          SELECT *
          FROM read_parquet(
            's3://overturemaps-us-west-2/release/' || getvariable('overture_release') || '/theme=places/type=place/*',
            hive_partitioning = true
          )
          LIMIT 10;
    freshness:
      method: release-calendar
      url: https://docs.overturemaps.org/release-calendar/

  - id: stac.earth-search.aws
    name: Earth Search STAC API
    description: Element 84 STAC API for cloud-optimized geospatial imagery, especially Sentinel collections hosted in the AWS open data ecosystem.
    status: candidate
    source_type: stac
    authority: Element 84 / AWS Open Data ecosystem
    homepage: https://earth-search.aws.element84.com/v1
    license_url: https://registry.opendata.aws/sentinel-2-l2a-cogs/
    attribution: Dataset-specific attribution required; verify per collection.
    tags: [stac, imagery, aws, sentinel]
    topics: [satellite imagery, earth observation, cloud optimized geotiff]
    coverage:
      spatial: global where source collections are available
      temporal: collection-specific acquisition dates
      grain: STAC item and asset metadata
    cadence: collection-specific updates
    ai:
      summary: Good STAC search target for AWS-hosted earth observation assets.
      use_cases: [discover Sentinel scenes, filter imagery by bounding box and date, inspect asset URLs]
      caveats: [license and attribution are collection-specific, assets may be large]
      prompt_hints: [Ask for collection, date range, cloud cover, and bbox before generating SQL.]
    duckdb:
      extensions:
        - httpfs
        - spatial
        - stac
      install: |
        INSTALL httpfs;
        INSTALL spatial;
        INSTALL stac FROM community;
      example_query: |
        LOAD httpfs;
        LOAD spatial;
        LOAD stac;
        SELECT collection, id, bbox
        FROM STAC_Search('https://earth-search.aws.element84.com/v1/search', max_items := 10)
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM STAC_Collections('https://earth-search.aws.element84.com/v1');
    freshness:
      method: stac-api
      url: https://earth-search.aws.element84.com/v1

