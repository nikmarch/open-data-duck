  - id: aws.noaa-ghcn-daily
    name: NOAA Global Historical Climatology Network Daily
    description: NOAA GHCN Daily station observations in public S3 CSV files for temperature, precipitation, and other daily climate measurements.
    status: candidate
    source_type: other
    authority: NOAA National Centers for Environmental Information
    homepage: https://registry.opendata.aws/noaa-ghcn/
    license_url: https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily
    attribution: NOAA National Centers for Environmental Information, Global Historical Climatology Network Daily.
    tags: [aws, noaa, climate, weather, csv]
    topics: [daily climate observations, stations, temperature, precipitation]
    coverage:
      spatial: global station network
      temporal: year-partitioned historical daily observations
      grain: station-day observation elements
    cadence: daily and historical updates
    ai:
      summary: Station-day climate observations suitable for DuckDB CSV scans from public S3 HTTPS URLs.
      use_cases: [analyze daily station observations, compare precipitation or temperature by year]
      caveats: [CSV files are large; filter by year/station/element early]
      prompt_hints: [Ask for year, station IDs, and climate elements before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT id, date, element, data_value
        FROM read_csv_auto('https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_year/2024.csv')
        LIMIT 10;
      validation_query: |
        SELECT count(*) > 0 AS ok
        FROM read_csv_auto('https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_year/2024.csv')
        LIMIT 1;
    freshness:
      method: aws-open-data-s3-prefix
      url: https://noaa-ghcn-pds.s3.amazonaws.com/?list-type=2&prefix=csv/by_year/&max-keys=5

