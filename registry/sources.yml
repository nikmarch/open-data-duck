  - id: nhtsa.vehicle-safety
    name: NHTSA vehicle safety recalls and ratings APIs
    description: Official National Highway Traffic Safety Administration vehicle recall campaigns and safety-rating lookup APIs, queryable as public JSON over HTTPS with DuckDB httpfs.
    status: candidate
    source_type: other
    authority: National Highway Traffic Safety Administration, U.S. Department of Transportation
    homepage: https://www.nhtsa.gov/nhtsa-datasets-and-apis
    license_url: https://www.nhtsa.gov/about-nhtsa/terms-use
    attribution: National Highway Traffic Safety Administration (NHTSA), U.S. Department of Transportation; credit NHTSA/DOT and do not imply endorsement.
    tables:
      - id: recalls_by_vehicle
        description: NHTSA recall campaign results for a requested model year, make, and model. One row per recall campaign result.
        columns_hint:
          NHTSACampaignNumber: NHTSA recall campaign identifier.
          ReportReceivedDate: Date NHTSA received the campaign report.
          Component: Vehicle component affected by the recall.
          Summary: Long recall summary text.
        ask_for: [model year, make, model, limit]
        warnings: [Parameterized API endpoint; preserve model year, make, and model filters instead of treating it as a full-table scan.]
      - id: safety_rating_variants
        description: NHTSA safety-rating vehicle variants for a requested model year, make, and model. One row per returned vehicle variant.
        columns_hint:
          VehicleId: Identifier used by NHTSA rating-detail lookups.
          VehicleDescription: Human-readable vehicle variant description.
        ask_for: [model year, make, model, limit]
        warnings: [Parameterized API endpoint; use the returned VehicleId for rating-detail lookups.]
    tags: [nhtsa, vehicle-safety, recalls, safety-ratings, json]
    topics: [vehicle recalls, crash-test ratings, automotive safety, campaign lookup, model-year lookup]
    coverage:
      spatial: United States vehicle safety programs and vehicles sold or recalled under NHTSA authority
      temporal: current NHTSA API data for the requested vehicle/campaign parameters
      grain: one recall campaign or safety-rating vehicle variant per requested vehicle lookup
    cadence: NHTSA APIs reflect current agency recall and safety-rating records as published
    ai:
      summary: Best official source for vehicle recall campaign lookups and NHTSA safety-rating variant discovery.
      use_cases: [look up recalls for a year make model, find NHTSA safety-rating vehicle ids, inspect affected components and recall summaries]
      caveats: [APIs are parameterized rather than full dataset scans, response field names use NHTSA casing, recall text fields can be long]
      prompt_hints: [Ask for model year, make, and model before generating SQL; use VehicleId from safety_rating_variants before requesting rating details.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT NHTSACampaignNumber,
               Component,
               ReportReceivedDate,
               Summary
        FROM (
          SELECT unnest(Results, recursive := true)
          FROM read_json_auto(
            'https://api.nhtsa.gov/recalls/recallsByVehicle?make=acura&model=rdx&modelYear=2012'
          )
        )
        ORDER BY NHTSACampaignNumber
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SELECT (
                 SELECT count(*) = 2
                 FROM (
                   SELECT unnest(Results, recursive := true)
                   FROM read_json_auto(
                     'https://api.nhtsa.gov/recalls/recallsByVehicle?make=acura&model=rdx&modelYear=2012'
                   )
                 )
               ) AS recalls_fixture_ok,
               (
                 SELECT count(*) = 2
                 FROM (
                   SELECT unnest(Results, recursive := true)
                   FROM read_json_auto(
                     'https://api.nhtsa.gov/SafetyRatings/modelyear/2012/make/Acura/model/RDX'
                   )
                 )
               ) AS safety_rating_variants_fixture_ok;
      examples:
        safety_rating_variants_by_vehicle: |
          LOAD httpfs;
          SELECT VehicleId,
                 VehicleDescription
          FROM (
            SELECT unnest(Results, recursive := true)
            FROM read_json_auto(
              'https://api.nhtsa.gov/SafetyRatings/modelyear/2012/make/Acura/model/RDX'
            )
          )
          ORDER BY VehicleId
          LIMIT 10;
        recalls_by_campaign: |
          LOAD httpfs;
          SELECT NHTSACampaignNumber,
                 Component,
                 ReportReceivedDate,
                 Summary
          FROM (
            SELECT unnest(Results, recursive := true)
            FROM read_json_auto(
              'https://api.nhtsa.gov/recalls/recallsByVehicle?make=honda&model=accord&modelYear=2018'
            )
          )
          ORDER BY NHTSACampaignNumber
          LIMIT 25;
  - id: usgs.earthquake.realtime-geojson
    name: USGS realtime earthquake GeoJSON feeds
    description: Official U.S. Geological Survey realtime earthquake summary feeds for recent seismic events, queryable directly from GeoJSON over HTTPS with DuckDB read_json_auto.
    status: candidate
    source_type: other
    authority: U.S. Geological Survey Earthquake Hazards Program
    homepage: https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php
    license_url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
    attribution: U.S. Geological Survey Earthquake Hazards Program; credit USGS earthquake feeds and do not imply USGS endorsement.
    tables:
      - id: earthquake_events
        description: Recent USGS earthquake event features. One row per reported seismic event in the selected rolling feed.
        columns_hint:
          mag: Earthquake magnitude.
          place: Human-readable event location.
          time: Event time in epoch milliseconds.
          geometry: GeoJSON point with longitude, latitude, and depth.
        ask_for: [feed window, magnitude threshold, bbox or region, limit]
        warnings: [Rolling feeds are not stable historical snapshots.]
    tags: [usgs, earthquakes, hazards, geojson, realtime]
    topics: [earthquakes, seismic events, natural hazards, realtime monitoring]
    coverage:
      spatial: global earthquake events reported by USGS and partner seismic networks
      temporal: rolling realtime feeds for the past hour, day, week, and 30 days
      grain: one earthquake event feature with magnitude, place, event time, status, and point geometry
    cadence: feeds update every minute; older events age out by feed window
    ai:
      summary: Best official USGS source for recent earthquake events when a user wants live seismic activity in DuckDB.
      use_cases: [list recent earthquakes by magnitude, monitor significant events, map recent seismic activity]
      caveats: [rolling feeds are not stable historical snapshots, all_day can be empty during unusually quiet periods, event coordinates are GeoJSON point arrays with longitude latitude depth]
      prompt_hints: [Ask for the feed window and magnitude threshold before generating SQL; use all_month for a stable validation smoke.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT id AS event_id,
               mag AS magnitude,
               place,
               time AS event_time_ms,
               geometry
        FROM read_json_auto(
          'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
          maximum_object_size = 16777216
        )
        WHERE type = 'earthquake'
        ORDER BY time DESC
        LIMIT 10;
      validation_query: |
        LOAD httpfs;
        SELECT count(*) > 0 AS ok
        FROM read_json_auto(
          'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson',
          maximum_object_size = 16777216
        )
        WHERE type = 'earthquake'
          AND id IS NOT NULL
          AND mag IS NOT NULL;
      examples:
        magnitude_4_5_week: |
          LOAD httpfs;
          SELECT id AS event_id, mag, place, time, updated, geometry
          FROM read_json_auto(
            'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson',
            maximum_object_size = 16777216
          )
          ORDER BY time DESC
          LIMIT 25;
        significant_month: |
          LOAD httpfs;
          SELECT id AS event_id, mag, place, alert, tsunami, sig, url
          FROM read_json_auto(
            'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson',
            maximum_object_size = 16777216
          )
          ORDER BY sig DESC
          LIMIT 25;
