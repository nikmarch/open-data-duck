    coverage:
      spatial: New York City
      temporal: 2020 to present
      grain: individual 311 service request records
    cadence: daily automated updates
    ai:
      summary: Authoritative NYC 311 request table for Socrata/SODA paging examples and municipal service analysis.
      use_cases: [query recent 311 complaints by borough, inspect service-request categories, test Socrata pagination]
      caveats: [large table requires bounded SODA queries, dataset metadata has no explicit license field, use the NYC Open Data law citation for use-policy context]
