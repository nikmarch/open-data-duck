# Open Data Duck seed registry.
# Status values: candidate, connector-blocked, verified, deprecated.

sources:
  - id: overture.maps.release
    name: Overture Maps source family
    description: Global open map data releases for places, buildings, transportation, addresses, divisions, and base layers queryable from public S3 with DuckDB httpfs.
    status: candidate
    source_type: overture
    authority: Overture Maps Foundation
    homepage: https://docs.overturemaps.org/getting-data/
    license_url: https://docs.overturemaps.org/attribution/
    attribution: Overture Maps Foundation and contributing data providers.
    tables:
      - id: place
        ref: odd.overturemaps.latest.place
        description: Places and points of interest. One row per Overture place feature.
        columns_hint:
          id: Stable Overture feature id.
          names: Nested names object; primary/common/local names are not plain text columns.
          bbox: Bounding box for fast spatial prefilters.
          geometry: Place geometry.
        ask_for: [bbox or area, release or latest, limit]
        warnings: [Large global table; always use tight bbox filters.]
        validations:
          - id: odd.overturemaps.latest.place
            description: Compare the latest Overture places facade with the direct public S3 parquet recipe over a sampled tiny bbox.
            release: latest
            compare: exact
            order_by: [id]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SET s3_region='us-west-2';
              SET VARIABLE overture_latest_release_url = (
                SELECT l.href
                FROM (SELECT unnest(links) AS l FROM read_json('https://stac.overturemaps.org/catalog.json'))
                WHERE l.rel = 'child' AND l.latest
              );
              SET VARIABLE s3_uri = (
                SELECT regexp_replace(
                         regexp_replace(min(assets.aws.href), '^https://([^.]+)\\.s3\\.[^/]+/', 's3://\\1/'),
                         '/part-[^/]+$',
                         '/*'
                       )
                FROM read_parquet(replace(getvariable('overture_latest_release_url'), '/catalog.json', '/collections.parquet'))
                WHERE collection = 'place'
              );

              SELECT id, names, bbox
              FROM read_parquet(getvariable('s3_uri'))
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SELECT id, names, bbox
              FROM odd.overturemaps.latest.place
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
          - id: odd.overturemaps.x2026x10x21.place
            description: Compare a pinned, SQL-safe Overture release facade with the same direct release path over a sampled tiny bbox.
            release: x2026x10x21
            source_release: 2026-10-21.0
            compare: exact
            order_by: [id]
            limit: 10
            direct_sql: |
              LOAD httpfs;
              SET s3_region='us-west-2';
              SET VARIABLE overture_s3_base = 's3://overturemaps-us-west-2';

              SELECT id, names, bbox
              FROM read_parquet(
                getvariable('overture_s3_base') || '/release/2026-10-21.0/theme=places/type=place/*'
              )
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
            odd_sql: |
              LOAD open_data_duck;
              ATTACH ':memory:' AS odd (TYPE open_data_duck);
              SELECT id, names, bbox
              FROM odd.overturemaps.x2026x10x21.place
              WHERE bbox.xmin <= 66.981
                AND bbox.xmax >= 66.976
                AND bbox.ymin <= 39.657
                AND bbox.ymax >= 39.652
              ORDER BY id
              LIMIT 10;
      - id: building
        ref: odd.overturemaps.latest.building
        description: Building footprint polygons. One row per Overture building feature.
