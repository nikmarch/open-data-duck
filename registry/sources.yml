      summary: Authoritative NYC 311 request table for Socrata/SODA paging examples and municipal service analysis.
      use_cases: [query recent 311 complaints by borough, inspect service-request categories, test Socrata pagination]
      caveats: [large table requires bounded SODA queries, dataset metadata has no explicit license field, use the NYC Open Data law citation for use-policy context]
      prompt_hints: [Ask for date range, borough, complaint type, and row limit before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT unique_key, created_date, complaint_type, borough, latitude, longitude
        FROM read_csv_auto('https://data.cityofnewyork.us/resource/erm2-nwe9.csv?$select=unique_key,created_date,complaint_type,borough,latitude,longitude&$where=created_date%20%3E=%20%272026-01-01T00:00:00%27&$order=unique_key&$limit=10');
      validation_query: |
        LOAD httpfs;
        SELECT count(*) > 0 AS ok
        FROM read_csv_auto('https://data.cityofnewyork.us/resource/erm2-nwe9.csv?$select=unique_key&$order=unique_key&$limit=1');
      examples:
        recent_borough_page: |
          LOAD httpfs;
          SELECT unique_key, created_date, complaint_type, borough, status
          FROM read_csv_auto('https://data.cityofnewyork.us/resource/erm2-nwe9.csv?$select=unique_key,created_date,complaint_type,borough,status&$where=borough=%27BROOKLYN%27%20AND%20created_date%20%3E=%20%272026-01-01T00:00:00%27&$order=unique_key&$limit=100&$offset=0');
    freshness:
      method: socrata-metadata-api
      url: https://data.cityofnewyork.us/api/views/metadata/v1/erm2-nwe9

  - id: socrata.cdc.places-county-2025
    name: CDC PLACES county health estimates, 2025 release
    description: CDC PLACES model-based county-level estimates for chronic disease outcomes, prevention measures, risk behaviors, disabilities, health status, and health-related social needs, published on the official CDC Socrata portal with bounded SODA export queries.
    status: candidate
    source_type: socrata
    authority: Centers for Disease Control and Prevention, National Center for Chronic Disease Prevention and Health Promotion, Division of Population Health
    homepage: https://data.cdc.gov/d/swc5-untb
    license_url: https://data.cdc.gov/api/views/metadata/v1/swc5-untb
    attribution: Centers for Disease Control and Prevention, National Center for Chronic Disease Prevention and Health Promotion, Division of Population Health. PLACES - Local Data for Better Health, County Data, 2025 release. Public domain.
    tags: [socrata, cdc, health, counties, public-domain, csv]
    topics: [public health, chronic disease, county estimates, health outcomes, social determinants]
    coverage:
      spatial: United States counties, keyed by county FIPS in locationid
      temporal: 2025 release (estimates mostly for 2022-2023 data years)
      grain: one row per county, measure, and data-value type (age-adjusted or crude prevalence)
    cadence: annual PLACES release; each release is a separate Socrata dataset id
    ai:
      summary: Authoritative public-domain CDC county health-estimate table, a natural join target for county boundary layers via the locationid FIPS code.
      use_cases: [compare health measures across counties in a state, join county health estimates to boundary data, inspect confidence limits for a single measure]
      caveats: [model-based small-area estimates rather than direct survey counts, each measure appears twice per county so filter datavaluetypeid to AgeAdjPrv or CrdPrv, 229k rows require bounded SODA paging, the dataset id is release-specific]
      prompt_hints: [Ask for state, measureid, and whether age-adjusted or crude prevalence is wanted before generating SQL.]
    duckdb:
      extensions:
        - httpfs
      install: |
        INSTALL httpfs;
      example_query: |
        LOAD httpfs;
        SELECT year, stateabbr, locationname, measureid, data_value, totalpopulation, locationid
        FROM read_csv_auto('https://data.cdc.gov/resource/swc5-untb.csv?$select=year,stateabbr,locationname,measureid,data_value,totalpopulation,locationid&$where=stateabbr=%27AK%27%20AND%20measureid=%27OBESITY%27%20AND%20datavaluetypeid=%27AgeAdjPrv%27&$order=locationid&$limit=10');
      validation_query: |
        LOAD httpfs;
        SELECT count(*) > 0 AS ok
        FROM read_csv_auto('https://data.cdc.gov/resource/swc5-untb.csv?$select=locationid&$order=locationid&$limit=1');
      examples:
        state_measure_page: |
          LOAD httpfs;
          SELECT locationid, locationname, measureid, data_value, low_confidence_limit, high_confidence_limit
          FROM read_csv_auto('https://data.cdc.gov/resource/swc5-untb.csv?$select=locationid,locationname,measureid,data_value,low_confidence_limit,high_confidence_limit&$where=stateabbr=%27TX%27%20AND%20datavaluetypeid=%27AgeAdjPrv%27&$order=locationid,measureid&$limit=1000&$offset=0');
    freshness:
      method: socrata-metadata-api
      url: https://data.cdc.gov/api/views/metadata/v1/swc5-untb

  - id: sourcecoop.vida.google-microsoft-open-buildings
    name: VIDA Google-Microsoft Open Buildings (Source Cooperative GeoParquet)
    description: VIDA's combined Google and Microsoft global building-footprint dataset, partitioned as public GeoParquet on Source Cooperative for direct DuckDB scans.
    status: candidate
    source_type: parquet
    authority: VIDA, combining Google Open Buildings V3 and Microsoft GlobalMLBuildingFootprints
    homepage: https://source.coop/repositories/vida/google-microsoft-open-buildings/description
    license_url: https://data.source.coop/vida/google-microsoft-open-buildings/README.md
    attribution: Google Open Buildings and Microsoft GlobalMLBuildingFootprints, combined by VIDA; licensed under ODbL v1.0.
    tags: [source-cooperative, buildings, geospatial, geoparquet, footprints]
    topics: [building footprints, open buildings, country partitions, S2 partitions]
    coverage:
      spatial: global where Google or Microsoft footprints are available
      temporal: merged source release snapshot
      grain: building-footprint polygon rows
    cadence: source README changelog updates
    ai:
      summary: Best seed source for direct DuckDB building-footprint examples using public GeoParquet.
      use_cases: [query building footprints by country, filter footprints by bounding box, compare footprint source and confidence]
      caveats: [large countries are partitioned; use country and S2 paths to avoid huge scans]
      prompt_hints: [Ask for ISO3 country code and bbox before generating SQL.]
    duckdb:
      extensions:
        - httpfs
        - spatial
      install: |
        INSTALL httpfs;
        INSTALL spatial;
      example_query: |
        LOAD httpfs;
        LOAD spatial;

        -- GeoParquet 1.1 partitioned by CGAZ ADM0 country ISO3 code.
        -- Path pattern: geoparquet/by_country/country_iso={ISO3}/{ISO3}.parquet
        -- The bbox struct allows pushdown filtering without loading the geometry.
        SELECT bf_source, confidence, area_in_meters, bbox, ST_AsText(geometry) AS wkt
        FROM read_parquet('https://data.source.coop/vida/google-microsoft-open-buildings/geoparquet/by_country/country_iso=AND/AND.parquet')
        WHERE bbox.xmin <= 1.55
          AND bbox.xmax >= 1.50
          AND bbox.ymin <= 42.52
          AND bbox.ymax >= 42.50
        LIMIT 5;
      validation_query: |
        LOAD httpfs;

        SELECT count(*) > 0 AS ok
        FROM read_parquet('https://data.source.coop/vida/google-microsoft-open-buildings/geoparquet/by_country/country_iso=AND/AND.parquet');
      examples:
        by_country_s2: |
          LOAD httpfs;

          -- S2 sub-partitions cap each file at 20M footprints for large countries.
          -- Path pattern: geoparquet/by_country_s2/country_iso={ISO3}/{S2_GRID_ID}.parquet
          SELECT count(*) AS footprints
          FROM read_parquet('https://data.source.coop/vida/google-microsoft-open-buildings/geoparquet/by_country/country_iso=AND/AND.parquet');
    freshness:
      method: readme-changelog
      url: https://data.source.coop/vida/google-microsoft-open-buildings/README.md
