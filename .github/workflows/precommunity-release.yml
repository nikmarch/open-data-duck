name: Pre-community Extension Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or update, for example v0.1.0-pre.1
        required: true
        type: string
      draft:
        description: Create a draft release instead of a public prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

env:
  DUCKDB_VERSION: v2.0.0
  CI_TOOLS_VERSION: v2.0-cyanoptera
  EXTENSION_NAME: open_data_duck
  RELEASE_ASSET: open_data_duck-v2.0.0-linux_amd64.duckdb_extension

jobs:
  duckdb-stable-build:
    name: Build Linux x64 extension
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: open_data_duck
      use_merged_vcpkg_manifest: "1"
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads

  publish-release:
    name: Smoke and publish release asset
    runs-on: ubuntu-latest
    needs: duckdb-stable-build
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download Linux x64 extension artifact
        uses: actions/download-artifact@v4
        with:
          name: open_data_duck-v2.0.0-extension-linux_amd64
          path: extension-artifact

      - name: Install DuckDB CLI
        run: |
          curl --fail --location --show-error \
            --output duckdb-cli-linux-amd64.tar.gz \
            https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb-cli-linux-amd64.tar.gz
          chmod +x duckdb

      - name: Smoke-test downloaded extension
        run: |
          test -f extension-artifact/open_data_duck.duckdb_extension
          ./duckdb -unsigned -noheader -csv :memory: > smoke.out <<'SQL'
          LOAD './extension-artifact/open_data_duck.duckdb_extension';
          SELECT open_data_duck_ping();
          SELECT length(open_data_duck_version()) > 0;
          SELECT open_data_duck_registry_source_count() > 0;
          SELECT count(*) > 0 FROM open_data_sources();
          SELECT open_data_sql('overture.maps.release') LIKE '%LOAD httpfs;%';
          SQL
          cat smoke.out
          grep -Fx 'open_data_duck: pong' smoke.out
          test "$(grep -c '^true$' smoke.out)" -eq 4

      - name: Stage release asset and notes
        run: |
          mkdir -p release-assets
          cp extension-artifact/open_data_duck.duckdb_extension "release-assets/${RELEASE_ASSET}"
          cat > release-notes.md <<EOF
          # Open Data Duck pre-community extension build

          This release carries an unsigned, pre-community DuckDB extension binary for validation before Open Data Duck is submitted to DuckDB community extensions.

          Compatibility:

          | DuckDB version | OS/arch | Artifact |
          | --- | --- | --- |
          | v2.0.0 | Linux x64 (linux_amd64) | ${RELEASE_ASSET} |

          These binaries are DuckDB-version- and platform-specific. They are not signed community-extension artifacts, and `INSTALL open_data_duck FROM community;` is not expected to work yet.

          Smoke test after download:

          ```
          duckdb -unsigned :memory:
          LOAD './${RELEASE_ASSET}';
          SELECT open_data_duck_ping();
          SELECT count(*) > 0 FROM open_data_sources();
          ```
          EOF

      - name: Create or update GitHub prerelease
        run: |
          title="Open Data Duck ${RELEASE_TAG} pre-community extension"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "release-assets/${RELEASE_ASSET}" --clobber
          else
            release_flags=(--title "${title}" --notes-file release-notes.md)
            if [ "${RELEASE_DRAFT}" = "true" ]; then
              release_flags+=(--draft)
            else
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "release-assets/${RELEASE_ASSET}" "${release_flags[@]}"
          fi
