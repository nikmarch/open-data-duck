name: Pre-community Extension Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or update, for example v0.1.0-pre.1
        required: true
        type: string
      draft:
        description: Create a draft release instead of a public prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

env:
  DUCKDB_VERSION: v2.0.0
  CI_TOOLS_VERSION: v2.0-cyanoptera
  EXTENSION_NAME: open_data_duck
  RELEASE_PLATFORMS: linux_amd64 osx_arm64

jobs:
  duckdb-stable-build:
    name: Build release extension binaries
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: open_data_duck
      use_merged_vcpkg_manifest: "1"
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads

  publish-release:
    name: Smoke and publish release assets
    runs-on: ubuntu-latest
    needs: duckdb-stable-build
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open_data_duck-v2.0.0-extension-*
          path: extension-artifacts
          merge-multiple: false

      - name: Install DuckDB CLI
        run: |
          curl --fail --location --show-error \
            --output duckdb-cli-linux-amd64.tar.gz \
            https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb-cli-linux-amd64.tar.gz
          chmod +x duckdb

      - name: Smoke-test downloaded Linux extension
        run: |
          linux_extension="extension-artifacts/open_data_duck-v2.0.0-extension-linux_amd64/open_data_duck.duckdb_extension"
          test -f "${linux_extension}"
          ./duckdb -unsigned -noheader -csv :memory: > smoke.out <<SQL
          LOAD '${linux_extension}';
          SELECT open_data_duck_ping();
          SELECT length(open_data_duck_version()) > 0;
          SELECT open_data_duck_registry_source_count() > 0;
          SELECT count(*) > 0 FROM open_data_sources();
          SELECT open_data_sql('overture.maps.release') LIKE '%LOAD httpfs;%';
          SQL
          cat smoke.out
          grep -Fx 'open_data_duck: pong' smoke.out
          test "$(grep -c '^true$' smoke.out)" -eq 4

      - name: Stage release assets and notes
        run: |
          mkdir -p release-assets
          for platform in ${RELEASE_PLATFORMS}; do
            artifact_dir="extension-artifacts/${EXTENSION_NAME}-${DUCKDB_VERSION}-extension-${platform}"
            artifact="${artifact_dir}/${EXTENSION_NAME}.duckdb_extension"
            release_asset="release-assets/${EXTENSION_NAME}-${DUCKDB_VERSION}-${platform}.duckdb_extension"
            test -f "${artifact}"
            cp "${artifact}" "${release_asset}"
          done
          (cd release-assets && sha256sum ./*.duckdb_extension > SHA256SUMS.txt)
          cat > release-notes.md <<'EOF'
          # Open Data Duck pre-community extension build

          This release carries unsigned, pre-community DuckDB extension binaries for validation before Open Data Duck is submitted to DuckDB community extensions.

          Compatibility:

          | DuckDB version | OS/arch | Artifact |
          | --- | --- | --- |
          | v2.0.0 | Linux x64 (linux_amd64) | open_data_duck-v2.0.0-linux_amd64.duckdb_extension |
          | v2.0.0 | macOS Apple Silicon (osx_arm64) | open_data_duck-v2.0.0-osx_arm64.duckdb_extension |

          These binaries are DuckDB-version- and platform-specific. They are not signed community-extension artifacts, and `INSTALL open_data_duck FROM community;` is not expected to work yet.

          The native extension is in active current development. Install commands, release asset names, and supported platforms may change before community extension acceptance.

          Smoke test after download. Save the versioned release asset as
          `open_data_duck.duckdb_extension` before loading; DuckDB derives the
          expected entrypoint from the local filename.

          ```
          set -euo pipefail

          release_tag="v0.1.0-pre.1"
          duckdb_version="v2.0.0"
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) platform="osx_arm64" ;;
            Linux-x86_64) platform="linux_amd64" ;;
            *) echo "unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac

          rm -f open_data_duck.duckdb_extension

          curl --fail --location \
            --output open_data_duck.duckdb_extension \
            "https://github.com/nikmarch/open-data-duck/releases/download/${release_tag}/open_data_duck-${duckdb_version}-${platform}.duckdb_extension"

          xattr -dr com.apple.quarantine open_data_duck.duckdb_extension 2>/dev/null || true
          codesign --force --deep --sign - open_data_duck.duckdb_extension 2>/dev/null || true

          duckdb -unsigned :memory: <<'SQL'
          LOAD './open_data_duck.duckdb_extension';
          SELECT open_data_duck_ping();
          SELECT count(*) > 0 FROM open_data_sources();
          SQL
          ```
          EOF

      - name: Create or update GitHub prerelease
        run: |
          title="Open Data Duck ${RELEASE_TAG} pre-community extension"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${title}" --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            release_flags=(--title "${title}" --notes-file release-notes.md)
            if [ "${RELEASE_DRAFT}" = "true" ]; then
              release_flags+=(--draft)
            else
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release-assets/* "${release_flags[@]}"
          fi
