name: Pre-community Extension Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or update, for example v0.1.0-pre.4
        required: true
        type: string
      draft:
        description: Create/update as a draft release instead of publishing a prerelease
        required: true
        default: true
        type: boolean
      create_tag:
        description: Create the Git tag from target_ref when it does not exist
        required: true
        default: true
        type: boolean
      target_ref:
        description: Branch, tag, or SHA to release; must match the workflow run ref
        required: true
        default: main
        type: string
      update_existing:
        description: Allow updating an existing tag/release instead of failing safely
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || '' }}
  cancel-in-progress: false

env:
  DUCKDB_VERSION: v2.0.0
  CI_TOOLS_VERSION: v2.0-cyanoptera
  EXTENSION_NAME: open_data_duck
  RELEASE_PLATFORMS: linux_amd64 osx_arm64

jobs:
  prepare-release:
    name: Validate release request and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_draft: ${{ steps.prepare.outputs.release_draft }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      tag_exists: ${{ steps.prepare.outputs.tag_exists }}
      release_exists: ${{ steps.prepare.outputs.release_exists }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.draft) || 'false' }}
      CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.create_tag) || 'false' }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
      UPDATE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.update_existing) || 'true' }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Validate request and create tag when requested
        id: prepare
        run: |
          set -euo pipefail

          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag must look like v0.1.0 or v0.1.0-pre.4; got ${RELEASE_TAG}" >&2
            exit 1
          fi

          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_REF}" --jq .sha)"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${target_sha}" != "${RUN_SHA}" ]; then
            echo "target_ref ${TARGET_REF} resolves to ${target_sha}, but this workflow run is ${RUN_SHA}." >&2
            echo "Run the workflow from the same branch/tag/SHA you are releasing, or set target_ref to this run ref." >&2
            exit 1
          fi

          tag_exists=false
          tag_sha=""
          if tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            tag_exists=true
            tag_sha="$(printf '%s' "${tag_json}" | jq -r '.object.sha')"
          fi

          release_exists=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${tag_exists}" = "true" ] || [ "${release_exists}" = "true" ]; then
              if [ "${UPDATE_EXISTING}" != "true" ]; then
                echo "${RELEASE_TAG} already has tag=${tag_exists}, release=${release_exists}. Set update_existing=true to update it." >&2
                exit 1
              fi
            elif [ "${CREATE_TAG}" = "true" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${RELEASE_TAG}" \
                -f sha="${target_sha}" >/dev/null
              tag_exists=true
              tag_sha="${target_sha}"
              echo "Created ${RELEASE_TAG} at ${target_sha}."
            else
              echo "${RELEASE_TAG} does not exist. Set create_tag=true or push the tag first." >&2
              exit 1
            fi
          fi

          if [ "${tag_exists}" = "true" ]; then
            echo "Using existing ${RELEASE_TAG} at ${tag_sha}."
          fi
          if [ "${release_exists}" = "true" ]; then
            echo "Updating existing release ${RELEASE_TAG}."
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_draft=${RELEASE_DRAFT}"
            echo "target_sha=${target_sha}"
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
          } >> "${GITHUB_OUTPUT}"

  duckdb-stable-build:
    name: Build release extension binaries
    needs: prepare-release
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: open_data_duck
      use_merged_vcpkg_manifest: "1"
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads

  publish-release:
    name: Smoke and publish release assets
    runs-on: ubuntu-latest
    needs: [prepare-release, duckdb-stable-build]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
      RELEASE_DRAFT: ${{ needs.prepare-release.outputs.release_draft }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}
          persist-credentials: false

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open_data_duck-v2.0.0-extension-*
          path: extension-artifacts
          merge-multiple: false

      - name: Install DuckDB CLI
        run: |
          curl --fail --location --show-error \
            --output duckdb-cli-linux-amd64.tar.gz \
            https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb-cli-linux-amd64.tar.gz
          chmod +x duckdb

      - name: Smoke-test downloaded Linux extension
        run: |
          linux_extension="extension-artifacts/open_data_duck-v2.0.0-extension-linux_amd64/open_data_duck.duckdb_extension"
          test -f "${linux_extension}"
          ./duckdb -unsigned -noheader -csv :memory: > smoke.out <<SQL
          LOAD '${linux_extension}';
          SELECT open_data_duck_ping();
          SELECT length(open_data_duck_version()) > 0;
          SELECT open_data_duck_registry_source_count() > 0;
          SELECT count(*) > 0 FROM open_data_sources();
          SELECT open_data_sql('overture.maps.release') LIKE '%FROM odd.overturemaps.latest.place%';
          SQL
          cat smoke.out
          grep -Fx 'open_data_duck: pong' smoke.out
          test "$(grep -c '^true$' smoke.out)" -eq 4

      - name: Stage release assets and notes
        run: |
          mkdir -p release-assets
          for platform in ${RELEASE_PLATFORMS}; do
            artifact_dir="extension-artifacts/${EXTENSION_NAME}-${DUCKDB_VERSION}-extension-${platform}"
            artifact="${artifact_dir}/${EXTENSION_NAME}.duckdb_extension"
            release_asset="release-assets/${EXTENSION_NAME}-${DUCKDB_VERSION}-${platform}.duckdb_extension"
            test -f "${artifact}"
            cp "${artifact}" "${release_asset}"
          done
          (cd release-assets && sha256sum ./*.duckdb_extension > SHA256SUMS.txt)
          python3 scripts/render_precommunity_release_notes.py "${RELEASE_TAG}" > release-notes.md

      - name: Create or update GitHub prerelease
        run: |
          title="Open Data Duck ${RELEASE_TAG} pre-community extension"
          release_flags=(--title "${title}" --notes-file release-notes.md --verify-tag)
          if [ "${RELEASE_DRAFT}" = "true" ]; then
            release_flags+=(--draft=true)
          else
            release_flags+=(--draft=false --prerelease=true)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" "${release_flags[@]}"
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* "${release_flags[@]}"
          fi
