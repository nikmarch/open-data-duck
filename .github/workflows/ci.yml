name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test and validate registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Validate registry
        run: uv run odd validate

  duckdb-extension-e2e:
    name: Real DuckDB extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install DuckDB extensions and run real SQL
        env:
          ODD_DUCKDB_NETWORK_TESTS: "1"
        run: uv run pytest tests/test_duckdb_execution.py -k real_duckdb_can_install_and_load_supported_extensions

  native-extension-scaffold:
    name: Native DuckDB extension scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build extension
        run: make -j$(nproc) BUILD_EXTENSION_TEST_DEPS=none

      - name: Run extension SQL smoke test
        run: make test BUILD_EXTENSION_TEST_DEPS=none T=test/sql/open_data_duck.test
