name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DUCKDB_VERSION: v2.0.0
  EXTENSION_NAME: open_data_duck
  EXTENSION_PLATFORM: linux_amd64
  EXTENSION_ARTIFACT: open_data_duck-v2.0.0-extension-linux_amd64
  CUSTOM_EXTENSION_REPO_PATH: extensions

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  duckdb-stable-build:
    name: Build Linux x64 extension for Pages repository
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: open_data_duck
      use_merged_vcpkg_manifest: "1"
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads

  build:
    name: Build Pages artifact
    needs: duckdb-stable-build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: python scripts/build_pages_site.py

      - name: Download Linux x64 extension artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXTENSION_ARTIFACT }}
          path: extension-artifact

      - name: Stage custom extension repository
        run: |
          repo_dir="_site/${CUSTOM_EXTENSION_REPO_PATH}/${DUCKDB_VERSION}/${EXTENSION_PLATFORM}"
          mkdir -p "${repo_dir}"
          gzip -c "extension-artifact/${EXTENSION_NAME}.duckdb_extension" > "${repo_dir}/${EXTENSION_NAME}.duckdb_extension.gz"
          cat > "_site/${CUSTOM_EXTENSION_REPO_PATH}/README.txt" <<'EOF'
          Open Data Duck temporary DuckDB extension repository.

          These pre-community binaries are unsigned. Start DuckDB with unsigned
          extensions enabled before installing from this repository URL.
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
