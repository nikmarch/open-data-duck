name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DUCKDB_VERSION: v2.0.0
  EXTENSION_NAME: open_data_duck
  EXTENSION_PLATFORMS: linux_amd64 osx_arm64
  CUSTOM_EXTENSION_REPO_PATH: extensions

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  duckdb-stable-build:
    name: Build Linux x64 and macOS arm64 extensions for Pages repository
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: open_data_duck
      use_merged_vcpkg_manifest: "1"
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads

  build:
    name: Build Pages artifact
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pages build dependencies
        run: python -m pip install .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: python scripts/build_pages_site.py

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: open_data_duck-v2.0.0-extension-*
          path: extension-artifacts
          merge-multiple: false

      - name: Stage custom extension repository
        run: |
          for platform in ${EXTENSION_PLATFORMS}; do
            artifact="extension-artifacts/${EXTENSION_NAME}-${DUCKDB_VERSION}-extension-${platform}/${EXTENSION_NAME}.duckdb_extension"
            repo_dir="_site/${CUSTOM_EXTENSION_REPO_PATH}/${DUCKDB_VERSION}/${platform}"
            test -f "${artifact}"
            mkdir -p "${repo_dir}"
            gzip -c "${artifact}" > "${repo_dir}/${EXTENSION_NAME}.duckdb_extension.gz"
          done
          cat > "_site/${CUSTOM_EXTENSION_REPO_PATH}/README.txt" <<'EOF'
          Open Data Duck temporary DuckDB extension repository.

          These pre-community binaries are unsigned. Start DuckDB with unsigned
          extensions enabled before installing from this repository URL.
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
