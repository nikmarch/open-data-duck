[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-data-duck"
version = "0.1.0"
description = "DuckDB-friendly index of pluggable public data tables"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "duckdb>=2.0.0",
  "pytest>=8.0",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
odd = "odd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["odd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
